<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Политехника — Хоккей</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --pt-blue:#2563EB; --grad-pt:linear-gradient(135deg,#2563EB,#3B82F6,#60A5FA);
  --bg:#F8FAFC; --card:#FFF; --border:#E2E8F0; --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8; --fill:#F1F5F9;
  --red:#EF4444; --green:#10B981; --orange:#F97316;
  --shadow-sm:0 2px 8px rgba(15,23,42,.08); --shadow-glow:0 0 24px rgba(37,99,235,.25);
  --radius-lg:22px; --radius-md:16px; --radius-pill:999px;
  --app-h:100dvh; --app-top:0px;
  --snow-color: #cbd5e1;
}
body.dark-theme {
  --bg:#0F172A; --card:#1E293B; --border:#334155; --text:#F8FAFC; --text-2:#94A3B8; --text-3:#64748B; --fill:#334155;
  --shadow-sm:0 2px 8px rgba(0,0,0,.5); --shadow-glow:0 0 24px rgba(37,99,235,.4);
  --snow-color: #475569;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);position:fixed;top:var(--app-top);left:0;right:0;height:var(--app-h);overflow:hidden; transition: background 0.3s, color 0.3s;}
.app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden; z-index: 2; transition: background 0.3s;}
#hdr{flex:0 0 auto;padding:16px 20px;background:var(--bg);border-bottom:1px solid var(--border);z-index:10;padding-top:calc(16px + env(safe-area-inset-top,0px)); transition: background 0.3s, border 0.3s;}
.hdr-title{font-size:32px;font-weight:800;letter-spacing:-.04em;background:var(--grad-pt);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#view{flex:1 1 auto;overflow-y:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.chat-bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--card);border-top:1px solid var(--border); transition: background 0.3s, border 0.3s;}
.chat-bar[hidden]{display:none}
.tabs{flex:0 0 auto;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px)); transition: background 0.3s, border 0.3s;}
.tabs[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 14px;border:none;background:none;color:var(--text-3);cursor:pointer;border-radius:var(--radius-pill)}
.tab.active{color:var(--pt-blue)}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab-label{font-size:11px;font-weight:600}
.card{background:var(--card);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border); transition: background 0.3s, border 0.3s;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--radius-pill);font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit; transition: transform 0.1s, background 0.3s;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--grad-pt);color:#fff;box-shadow:var(--shadow-glow)}
.btn-secondary{background:var(--fill);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--pt-blue);padding:8px 12px}
.btn-icon{padding:10px;min-width:42px;height:42px}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:16px;background:var(--card);color:var(--text);outline:none;font-family:inherit; transition: background 0.3s, border 0.3s, color 0.3s;}
.input:focus{border-color:var(--pt-blue);box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.app-icon{width:80px;height:80px;border-radius:20px;background:var(--grad-pt);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:var(--shadow-glow)}
.modal-bg{position:fixed;top:var(--app-top);left:0;right:0;height:var(--app-h);background:rgba(15,23,42,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;overflow:hidden; transition: background 0.3s;}
.modal-header{flex:0 0 auto;padding:10px 20px 12px;background:var(--card);border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0; transition: background 0.3s, border 0.3s;}
.modal-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 120px;display:flex;flex-direction:column;gap:12px}
.modal-handle{width:36px;height:6px;background:var(--border);border-radius:3px;margin:0 auto 10px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--text-3)}
.chat-msg{max-width:78%;padding:8px 12px;border-radius:18px;box-shadow:var(--shadow-sm);word-break:break-word;white-space:pre-wrap; transition: background 0.3s;}
.chat-msg:active {opacity: 0.8;}
.chat-msg .msg-sticker{font-size:76px;line-height:1;padding:0}
.sticker-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px;background:var(--fill);border-radius:var(--radius-md);max-height:200px;overflow-y:auto}
.sticker-panel button{font-size:26px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.bday-card{padding:14px 18px;border-radius:18px;font-size:15px;font-weight:600;text-align:center;box-shadow:var(--shadow-sm);white-space:pre-wrap;line-height:1.4;max-width:92%}

/* Снег */
#snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; display: none; }
.snowflake { position: absolute; top: -10px; color: var(--snow-color); font-size: 1.2em; opacity: 0.7; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(110vh); } }

/* iOS переключатели */
.switch { position: relative; display: inline-block; width: 50px; height: 30px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--green); }
input:checked + .slider:before { transform: translateX(20px); }
body.dark-theme .slider { background-color: #475569; }
body.dark-theme input:checked + .slider { background-color: var(--green); }

/* Реакции */
.reactions-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.reaction-pill { background: var(--fill); border: 1px solid var(--border); border-radius: 12px; padding: 2px 6px; font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.2s; }
.reaction-pill.my-reaction { background: rgba(37,99,235,0.15); border-color: var(--pt-blue); }
</style>
</head>
<body>
<div id="snow-container"></div>

<div class="app">
  <header id="hdr"></header>
  <main id="view"></main>
  <div id="chatBar" class="chat-bar" hidden></div>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-tab="home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="tab-label">Главная</span></button>
    <button class="tab" data-tab="calendar" onclick="setTab('calendar')"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg><span class="tab-label">Календарь</span></button>
    <button class="tab" data-tab="chat" onclick="setTab('chat')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span class="tab-label">Чат</span></button>
    <button class="tab" data-tab="team" onclick="setTab('team')"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span class="tab-label">Команда</span></button>
  </nav>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-header" id="modalHeader"></div><div class="modal-body" id="modalBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB05YHmSSZgCFM-FYwnMhbk4eBdOoVNHss",
  authDomain: "hockey-politech.firebaseapp.com",
  projectId: "hockey-politech",
  storageBucket: "hockey-politech.firebasestorage.app",
  messagingSenderId: "618530656800",
  appId: "1:618530656800:web:028c3785863de533506245"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userSettings = {
  theme: localStorage.getItem('app_theme') || 'light',
  animations: localStorage.getItem('app_animations') !== 'false',
  vibration: localStorage.getItem('app_vibration') !== 'false'
};
if (userSettings.theme === 'dark') document.body.classList.add('dark-theme');

(function createSnow() {
  const container = document.getElementById('snow-container');
  if (!container || !userSettings.animations) return;
  container.style.display = 'block';
  container.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake'; flake.innerText = '❄';
    flake.style.left = Math.random() * 100 + 'vw';
    flake.style.animationDuration = (Math.random() * 3 + 4) + 's';
    flake.style.animationDelay = Math.random() * 5 + 's';
    container.appendChild(flake);
  }
})();

(function(){
  const root = document.documentElement;
  function apply(){
    const vv = window.visualViewport;
    if (vv) { root.style.setProperty('--app-h', vv.height + 'px'); root.style.setProperty('--app-top', vv.offsetTop + 'px'); }
    else { root.style.setProperty('--app-h', window.innerHeight + 'px'); root.style.setProperty('--app-top', '0px'); }
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', apply); window.visualViewport.addEventListener('scroll', apply); }
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
  apply();
})();

function esc(s){ if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function initials(name){ if (!name) return '?'; return name.split(' ').filter(Boolean).map(w=>w[0]).join('').substr(0,2).toUpperCase() || '?'; }
function formatDate(ts){ return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function formatTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const el = document.getElementById('toast'); if(!el) return; el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2500); }
function vibrate(ms = 15) { if (!userSettings.vibration || !navigator.vibrate) return; navigator.vibrate(ms); }
function showModal(bodyHtml, headerHtml){
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalHeader').innerHTML = '<div class="modal-handle"></div>' + (headerHtml || '');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); document.getElementById('modalBody').innerHTML=''; document.getElementById('modalHeader').innerHTML=''; }

let DB = { users:{}, events:{}, threads:{}, polls:{}, venues:{} };
let state = { tab:'home', threadId:null, eventId:null, eventFromTab:'calendar', messages:{}, unsub:[], birthdayChecked:false };
let currentUser = null, currentProfile = null;

function hasRole(){ const arr = [].slice.call(arguments); return !!currentProfile && arr.indexOf(currentProfile.role) >= 0; }
function canManageEvents(){ return hasRole('owner','admin','coach','captain','assistant'); }
function canPin(){ return hasRole('owner','admin','coach','captain','assistant'); }
function canManageUsers(){ return hasRole('owner','admin'); }
function roleLabel(r){ const l = { owner:'Владелец', admin:'Админ', coach:'Тренер', captain:'Капитан', assistant:'Ассистент', player:'Игрок' }; return l[r] || r; }
function roleIcon(r){ const i = { owner:'👑', admin:'🔧', coach:'📋', captain:'🏒', assistant:'🤝' }; return i[r] || ''; }

function renderAvatar(user, size){ 
  size = size || 48; 
  if (!user) return ''; 
  if (user.avatarUrl) return '<img src="' + user.avatarUrl + '" class="avatar" style="width:'+size+'px;height:'+size+'px;object-fit:cover;">';
  const colors = { goalie:'linear-gradient(135deg,#3B82F6,#8B5CF6)', defense:'linear-gradient(135deg,#10B981,#34D399)', forward:'linear-gradient(135deg,#F97316,#EC4899)' }; 
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+(colors[user.position]||'var(--grad-pt)')+';font-size:'+Math.round(size/3)+'px">' + esc(user.short || initials(user.name)) + '</div>'; 
}

function renderNameBlock(user, isMe, colorClass = 'text-2') {
  if (!user) return '';
  return `<div style="line-height:1.2;"><div style="font-weight:700; font-size:14px;">${esc(user.nickname || user.name || '?')}</div>${user.name ? `<div class="tiny" style="color:var(--${colorClass});">${esc(user.name)}</div>` : ''}</div>`;
}

function subscribeAll(){
  state.unsub.forEach(u => { try { u(); } catch(_){} });
  state.unsub = [];
  state.unsub.push(onSnapshot(collection(db,'users'), snap => { DB.users = {}; snap.forEach(d => DB.users[d.id] = d.data()); if (currentUser && DB.users[currentUser.uid]) currentProfile = DB.users[currentUser.uid]; if (!state.threadId && !state.eventId) render(); }));
  state.unsub.push(onSnapshot(collection(db,'events'), snap => { DB.events = {}; snap.forEach(d => DB.events[d.id] = d.data()); if (!state.threadId) { if (state.eventId) renderEventDetail(); else render(); } }));
  state.unsub.push(onSnapshot(collection(db,'threads'), snap => { DB.threads = {}; snap.forEach(d => DB.threads[d.id] = d.data()); renderChatListIfActive(); }));
  state.unsub.push(onSnapshot(collection(db,'polls'), snap => { DB.polls = {}; snap.forEach(d => DB.polls[d.id] = d.data()); if (state.tab === 'home') render(); }));
  state.unsub.push(onSnapshot(collection(db,'venues'), snap => { DB.venues = {}; snap.forEach(d => DB.venues[d.id] = d.data()); if (state.tab === 'calendar') render(); }));
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user; 
    const userSnap = await getDoc(doc(db,'users',user.uid));
    if (userSnap.exists()) { currentProfile = userSnap.data(); subscribeAll(); render(); } 
    else { renderActivationScreen(); }
  } else { currentUser = null; currentProfile = null; state.unsub.forEach(u=>{try{u()}catch(_){}}); state.unsub = []; renderLogin(); }
});

function setTab(tab){ 
  if (state.unsub._msgs) { state.unsub._msgs(); state.unsub._msgs = null; } 
  state.tab = tab; state.threadId = null; state.eventId = null; render(); 
}

function render(){
  hideChatBar(); 
  if (!currentUser || !currentProfile) return;
  const tabsEl = document.getElementById('tabs');
  if(tabsEl) tabsEl.hidden = false;
  renderHeader();
  switch(state.tab){ 
    case 'home': renderHome(); break; 
    case 'calendar': renderCalendar(); break; 
    case 'chat': renderChat(); break; 
    case 'team': renderTeam(); break; 
  }
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
}

function renderHeader(){
  const titles = { home:'🏒 Политехника', calendar:'Календарь', chat:'Чат', team:'Команда' };
  const hdr = document.getElementById('hdr');
  if(hdr) hdr.innerHTML = '<div class="row" style="justify-content:space-between"><div class="hdr-title">' + (titles[state.tab]||'') + '</div><div class="row" style="gap:12px;"><button class="btn btn-ghost" style="padding:4px;" onclick="showSettings()">⚙️</button><div onclick="editMyProfile()" style="cursor:pointer">' + renderAvatar(currentProfile, 40) + '</div></div></div>';
}

function hideChatBar(){ const bar = document.getElementById('chatBar'); if(bar) { bar.hidden = true; bar.innerHTML = ''; } }

function showSettings() {
  vibrate(10);
  showModal(
    '<div style="display:flex; flex-direction:column; gap:16px;">' +
      '<div class="row" style="justify-content:space-between; padding: 8px 0; border-bottom:1px solid var(--border)"><div><div style="font-weight:700;">Тёмная тема</div></div><label class="switch"><input type="checkbox" id="setTheme" ' + (userSettings.theme === 'dark' ? 'checked' : '') + '><span class="slider"></span></label></div>' +
      '<div class="row" style="justify-content:space-between; padding: 8px 0; border-bottom:1px solid var(--border)"><div><div style="font-weight:700;">Анимации</div></div><label class="switch"><input type="checkbox" id="setAnim" ' + (userSettings.animations ? 'checked' : '') + '><span class="slider"></span></label></div>' +
      '<div class="row" style="justify-content:space-between; padding: 8px 0;"><div><div style="font-weight:700;">Вибрация</div></div><label class="switch"><input type="checkbox" id="setVibe" ' + (userSettings.vibration ? 'checked' : '') + '><span class="slider"></span></label></div>' +
    '</div>', '<div class="row"><h3 style="margin:0;font-size:18px">Настройки</h3></div>'
  );
  document.getElementById('setTheme').onchange = (e) => { userSettings.theme = e.target.checked ? 'dark' : 'light'; localStorage.setItem('app_theme', userSettings.theme); document.body.classList.toggle('dark-theme', userSettings.theme === 'dark'); vibrate(10); };
  document.getElementById('setAnim').onchange = (e) => { userSettings.animations = e.target.checked; localStorage.setItem('app_animations', userSettings.animations); document.getElementById('snow-container').style.display = userSettings.animations ? 'block' : 'none'; vibrate(10); };
  document.getElementById('setVibe').onchange = (e) => { userSettings.vibration = e.target.checked; localStorage.setItem('app_vibration', userSettings.vibration); };
}

function renderHome(){
  const now = Date.now();
  const events = Object.values(DB.events).filter(e => e.startsAt > now && !e.cancelled).sort((a,b)=>a.startsAt-b.startsAt);
  const next = events[0];
  let html = '';
  if (next) {
    const going = next.rsvp ? Object.values(next.rsvp).filter(v => v === 'going').length : 0;
    const myStatus = next.rsvp && next.rsvp[currentUser.uid];
    html += '<div class="card" style="background:var(--grad-pt);color:#fff;border:none"><div class="tiny" style="color:rgba(255,255,255,.85);text-transform:uppercase">Следующая игра</div><div style="font-size:22px;font-weight:700;margin-top:4px">' + esc(next.title) + '</div><div style="opacity:.9;font-size:14px">' + formatDate(next.startsAt) + ' · ' + formatTime(next.startsAt) + ' · ' + esc(next.venue) + '</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn ' + (myStatus==='going'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvp(\''+next.id+'\',\'going\')">✓ Иду</button><button class="btn ' + (myStatus==='declined'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvp(\''+next.id+'\',\'declined\')">✕</button></div></div>';
  }
  const activePolls = Object.values(DB.polls).filter(p => !p.threadId && !p.closed);
  if (activePolls.length) { html += '<h3 style="margin:20px 0 12px;font-size:20px">📊 Опросы</h3>'; activePolls.forEach(p => html += renderPoll(p, null)); }
  if (canPin()) html += '<button class="btn btn-secondary" onclick="showCreatePoll(null)" style="width:100%;margin-bottom:14px">📊 Создать опрос</button>';
  document.getElementById('view').innerHTML = html || '<div class="empty-state"><h3>Главная пуста</h3></div>';
}

async function setRsvp(eventId, status){
  vibrate(10); const e = DB.events[eventId]; if (!e) return;
  const rsvp = e.rsvp || {}; rsvp[currentUser.uid] = status;
  await updateDoc(doc(db,'events',eventId), { rsvp });
}

function renderCalendar(){
  const now = Date.now(); const events = Object.values(DB.events).filter(e => e.startsAt > now && !e.cancelled).sort((a,b)=>a.startsAt-b.startsAt); let html = '';
  if (canPin()) html += '<button class="btn btn-primary" onclick="showCreateEvent()" style="width:100%;margin-bottom:12px">＋ Создать событие</button>';
  if (events.length) events.forEach(e => html += renderEventCard(e));
  else html += '<div class="empty-state"><h3>Нет предстоящих событий</h3></div>';
  document.getElementById('view').innerHTML = html;
}

function renderEventCard(e){
  const going = e.rsvp ? Object.values(e.rsvp).filter(v => v === 'going').length : 0;
  return '<div class="card" style="cursor:pointer" onclick="openEvent(\''+e.id+'\')"><div class="row"><div style="flex:1"><div style="font-weight:700;font-size:16px">' + esc(e.title) + '</div><div class="small muted">' + formatDate(e.startsAt) + ' · ' + formatTime(e.startsAt) + ' · ' + esc(e.venue) + '</div></div><div style="font-size:22px;font-weight:800;color:var(--pt-blue)">' + going + '</div></div></div>';
}

function showCreateEvent(){
  showModal(
    '<select class="input" id="evType"><option value="training">Тренировка</option><option value="game">Игра</option></select><input class="input" id="evTitle" placeholder="Название"><input class="input" id="evDate" type="datetime-local"><input class="input" id="evVenue" placeholder="Арена"><button class="btn btn-primary" style="width:100%" onclick="submitCreateEvent()">Создать</button>',
    '<h3>Новое событие</h3>'
  );
}

async function submitCreateEvent(){
  const type = document.getElementById('evType').value;
  let title = document.getElementById('evTitle').value.trim() || (type==='game'?'Игра':'Тренировка');
  const dateVal = document.getElementById('evDate').value;
  const venue = document.getElementById('evVenue').value.trim() || 'Арена';
  if (!dateVal) { toast('Выберите дату'); return; }
  const id = 'ev_' + Date.now().toString(36);
  await setDoc(doc(db,'events',id), { id, type, title, startsAt: new Date(dateVal).getTime(), venue, rsvp:{}, cancelled:false });
  closeModal(); toast('Создано');
}

function openEvent(id){ state.eventId = id; state.eventFromTab = state.tab; state.tab = 'calendar'; renderEventDetail(); }

function renderEventDetail(){
  const e = DB.events[state.eventId]; if (!e) return;
  const going = e.rsvp ? Object.entries(e.rsvp).filter(([_,v])=>v==='going').map(([uid])=>DB.users[uid]).filter(Boolean) : [];
  let html = '<div class="card"><button class="btn btn-secondary" style="margin-bottom:10px" onclick="backFromEvent()">← Назад</button><h2>' + esc(e.title) + '</h2><div class="small muted">' + formatDate(e.startsAt) + ' · ' + formatTime(e.startsAt) + ' · ' + esc(e.venue) + '</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" style="flex:1" onclick="setRsvp(\''+e.id+'\',\'going\')">✓ Иду</button><button class="btn btn-secondary" style="flex:1" onclick="setRsvp(\''+e.id+'\',\'declined\')">✕</button></div></div>';
  html += '<h4 style="margin:14px 0 8px">Идут (' + going.length + ')</h4>';
  going.forEach(u => html += '<div class="card row" style="padding:10px">' + renderAvatar(u, 38) + renderNameBlock(u) + '</div>');
  document.getElementById('view').innerHTML = html;
}

function backFromEvent(){ state.eventId = null; state.tab = state.eventFromTab; render(); }

function renderChat(){
  if (state.threadId) { renderThread(state.threadId); return; }
  renderChatListIfActive();
}

function renderChatListIfActive(){
  if (state.tab !== 'chat' || state.threadId) return;
  let html = '<h3 style="margin-bottom:12px">Чаты</h3>';
  html += '<div class="card row" style="cursor:pointer;margin-bottom:10px" onclick="openThread(\'general\')"><div class="avatar" style="width:46px;height:46px;background:var(--grad-pt)">💬</div><div style="flex:1"><div style="font-weight:600">Общий чат</div><div class="small muted">Главный чат команды</div></div></div>';
  document.getElementById('view').innerHTML = html;
}

function openThread(threadId){
  state.threadId = threadId; 
  if (state.unsub._msgs) state.unsub._msgs();
  const q = query(collection(db, 'threads', threadId, 'messages'), orderBy('ts','asc'), limit(100));
  state.unsub._msgs = onSnapshot(q, snap => {
    const msgs = []; snap.forEach(d => msgs.push({ id:d.id, ...d.data() }));
    state.messages[threadId] = msgs;
    if (state.threadId === threadId && state.tab === 'chat') renderThreadMessages(threadId);
  });
  render();
}

function closeThread(){ 
  if (state.unsub._msgs) { state.unsub._msgs(); state.unsub._msgs = null; } 
  state.threadId = null; render(); 
}

function renderThread(threadId){
  const thread = DB.threads[threadId] || { name: 'Чат' };
  const hdr = document.getElementById('hdr');
  if(hdr) hdr.innerHTML = '<div class="row" style="justify-content:space-between; width:100%;"><button class="btn btn-ghost" style="padding:8px 0" onclick="closeThread()">← Назад</button><div style="font-weight:700;font-size:18px; flex:1; text-align:center;">' + esc(thread.name) + '</div><div style="width:40px"></div></div>';
  renderThreadMessages(threadId); showChatBar(threadId);
}

function renderThreadMessages(threadId){
  const msgs = state.messages[threadId] || [];
  let html = '<div style="display:flex;flex-direction:column;gap:8px">';
  msgs.forEach(m => {
    const isMe = m.userId === currentUser.uid;
    const author = DB.users[m.userId] || { name:'?' };
    html += '<div style="display:flex;flex-direction:column;align-items:'+(isMe?'flex-end':'flex-start')+'"><div class="chat-msg" style="background:'+(isMe?'var(--pt-blue)':'var(--card)')+';color:'+(isMe?'#fff':'var(--text')+';">'+(!isMe?'<div class="tiny" style="font-weight:700;margin-bottom:2px">'+esc(author.nickname||author.name)+'</div>':'')+esc(m.text)+'</div></div>';
  });
  html += '</div>';
  const view = document.getElementById('view');
  if(view) { view.innerHTML = html; view.scrollTop = view.scrollHeight; }
}

function showChatBar(threadId){
  const bar = document.getElementById('chatBar'); 
  if(!bar) return;
  bar.hidden = false;
  bar.innerHTML = '<input class="input" id="chatInput" placeholder="Сообщение..." style="flex:1"><button class="btn btn-primary" onclick="sendChatMessage(\''+threadId+'\')">➤</button>';
}

async function sendChatMessage(threadId){
  const input = document.getElementById('chatInput'); if (!input) return;
  const text = input.value.trim(); if (!text) return;
  input.value = '';
  await addDoc(collection(db,'threads',threadId,'messages'), { userId: currentUser.uid, type:'text', text, ts: Date.now() });
}

function renderTeam(){
  const users = Object.values(DB.users).filter(u => u.status === 'active');
  let html = '<h3 style="margin-bottom:12px">Команда</h3>';
  users.forEach(u => {
    html += '<div class="card row" style="padding:12px;margin-bottom:8px">' + renderAvatar(u, 44) + '<div style="flex:1">' + renderNameBlock(u) + '<div class="tiny muted">' + roleLabel(u.role) + '</div></div></div>';
  });
  document.getElementById('view').innerHTML = html;
}

function renderPoll(poll, threadId){
  return '<div class="card"><h4>📊 ' + esc(poll.question) + '</h4></div>';
}

function showCreatePoll(threadId){
  if (!canPin()) return;
  showModal(
    '<input class="input" id="pollQ" placeholder="Вопрос опроса"><input class="input" id="pollOpt1" placeholder="Вариант 1"><input class="input" id="pollOpt2" placeholder="Вариант 2"><button class="btn btn-primary" style="width:100%" onclick="submitCreatePoll()">Создать</button>',
    '<h3>Новый опрос</h3>'
  );
}

async function submitCreatePoll(){
  const q = document.getElementById('pollQ').value.trim();
  if (!q) { toast('Введите вопрос'); return; }
  const id = 'poll_' + Date.now().toString(36);
  await setDoc(doc(db,'polls',id), { id, question: q, options:[{id:'o1',text:'Да',votes:[]},{id:'o2',text:'Нет',votes:[]}], closed:false });
  closeModal(); toast('Опрос создан');
}

function renderLogin(){
  const tabs = document.getElementById('tabs'); if(tabs) tabs.hidden = true;
  const hdr = document.getElementById('hdr'); if(hdr) hdr.innerHTML = '';
  document.getElementById('view').innerHTML = '<div class="card" style="margin-top:40px"><h2 style="margin-bottom:16px">Вход</h2><input class="input" id="loginEmail" placeholder="Email" style="margin-bottom:10px"><input class="input" id="loginPassword" type="password" placeholder="Пароль" style="margin-bottom:16px"><button class="btn btn-primary" style="width:100%" onclick="doLogin()">Войти</button></div>';
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  try { await signInWithEmailAndPassword(auth, email, pass); } catch(e) { toast('Ошибка входа'); }
}

function renderActivationScreen(){
  const tabs = document.getElementById('tabs'); if(tabs) tabs.hidden = true;
  document.getElementById('view').innerHTML = '<div class="card"><h2>Профиль не найден</h2><button class="btn btn-secondary" onclick="signOut(auth)" style="margin-top:10px">Выйти</button></div>';
}

function editMyProfile(){
  showModal(
    '<input class="input" id="editNick" value="' + esc(currentProfile.nickname||'') + '" placeholder="Никнейм" style="margin-bottom:16px">' +
    '<button class="btn btn-primary" style="width:100%" onclick="saveMyProfile()">Сохранить</button>',
    '<h3>Профиль</h3>'
  );
}

async function saveMyProfile(){
  const nickname = document.getElementById('editNick').value.trim();
  await updateDoc(doc(db,'users',currentUser.uid), { nickname });
  closeModal(); toast('Сохранено');
}

window.setTab = setTab;
window.openEvent = openEvent;
window.backFromEvent = backFromEvent;
window.setRsvp = setRsvp;
window.openThread = openThread;
window.closeThread = closeThread;
window.showCreateEvent = showCreateEvent;
window.submitCreateEvent = submitCreateEvent;
window.showCreatePoll = showCreatePoll;
window.submitCreatePoll = submitCreatePoll;
window.sendChatMessage = sendChatMessage;
window.editMyProfile = editMyProfile;
window.saveMyProfile = saveMyProfile;
window.doLogin = doLogin;
window.showSettings = showSettings;
window.closeModal = closeModal;
</script>
</body>
