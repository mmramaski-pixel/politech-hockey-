<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Политехника — Хоккей</title>
<style>
:root{--pt-blue:#2563EB;--grad-pt:linear-gradient(135deg,#2563EB,#3B82F6,#60A5FA);--bg:#F8FAFC;--card:#FFF;--border:#E2E8F0;--text:#0F172A;--text-2:#64748B;--text-3:#94A3B8;--fill:#F1F5F9;--red:#EF4444;--green:#10B981;--orange:#F97316;--shadow-sm:0 2px 8px rgba(15,23,42,.08);--shadow-glow:0 0 24px rgba(37,99,235,.25);--radius-lg:22px;--radius-md:16px;--radius-pill:999px;--app-h:100dvh;--app-top:0px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);position:fixed;top:var(--app-top);left:0;right:0;height:var(--app-h);overflow:hidden}
.app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
#hdr{flex:0 0 auto;padding:16px 20px;background:var(--bg);border-bottom:1px solid var(--border);z-index:10;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.hdr-title{font-size:32px;font-weight:800;letter-spacing:-.04em;background:var(--grad-pt);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#view{flex:1 1 auto;overflow-y:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.chat-bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--card);border-top:1px solid var(--border)}
.chat-bar[hidden]{display:none}
.tabs{flex:0 0 auto;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 14px;border:none;background:none;color:var(--text-3);cursor:pointer;border-radius:var(--radius-pill)}
.tab.active{color:var(--pt-blue)}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab-label{font-size:11px;font-weight:600}
.card{background:var(--card);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--radius-pill);font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--grad-pt);color:#fff;box-shadow:var(--shadow-glow)}
.btn-secondary{background:var(--fill);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--pt-blue);padding:8px 12px}
.btn-icon{padding:10px;min-width:42px;height:42px}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:16px;background:var(--card);color:var(--text);outline:none;font-family:inherit}
.input:focus{border-color:var(--pt-blue);box-shadow:0 0 0 4px rgba(37,99,235,.25)}
.app-icon{width:80px;height:80px;border-radius:20px;background:var(--grad-pt);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:var(--shadow-glow)}
.modal-bg{position:fixed;top:var(--app-top);left:0;right:0;height:var(--app-h);background:rgba(15,23,42,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal-header{flex:0 0 auto;padding:10px 20px 12px;background:var(--card);border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 120px;display:flex;flex-direction:column;gap:12px}
.modal-handle{width:36px;height:6px;background:var(--border);border-radius:3px;margin:0 auto 10px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:12px;color:var(--text-3)}
.chat-msg{max-width:78%;padding:8px 12px;border-radius:18px;box-shadow:var(--shadow-sm);word-break:break-word;white-space:pre-wrap}
.chat-msg .msg-sticker{font-size:76px;line-height:1;padding:0}
.sticker-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px;background:var(--fill);border-radius:var(--radius-md);max-height:200px;overflow-y:auto}
.sticker-panel button{font-size:26px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.bday-card{padding:14px 18px;border-radius:18px;font-size:15px;font-weight:600;text-align:center;box-shadow:var(--shadow-sm);white-space:pre-wrap;line-height:1.4;max-width:92%}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="view"></main>
  <div id="chatBar" class="chat-bar" hidden></div>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-tab="home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="tab-label">Главная</span></button>
    <button class="tab" data-tab="calendar" onclick="setTab('calendar')"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg><span class="tab-label">Календарь</span></button>
    <button class="tab" data-tab="chat" onclick="setTab('chat')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span class="tab-label">Чат</span></button>
    <button class="tab" data-tab="team" onclick="setTab('team')"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span class="tab-label">Команда</span></button>
  </nav>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-header" id="modalHeader"></div><div class="modal-body" id="modalBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB05YHmSSZgCFM-FYwnMhbk4eBdOoVNHss",
  authDomain: "hockey-politech.firebaseapp.com",
  projectId: "hockey-politech",
  storageBucket: "hockey-politech.firebasestorage.app",
  messagingSenderId: "618530656800",
  appId: "1:618530656800:web:028c3785863de533506245"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* CLEANUP */
function cleanupSubs() {
  state.unsub.forEach(u => { try { u(); } catch(_) {} });
  state.unsub = [];
}

/* VIEWPORT */
(function(){
  const root = document.documentElement;
  function apply(){
    const vv = window.visualViewport;
    if (vv) { root.style.setProperty('--app-h', vv.height + 'px'); root.style.setProperty('--app-top', vv.offsetTop + 'px'); }
    else { root.style.setProperty('--app-h', window.innerHeight + 'px'); root.style.setProperty('--app-top', '0px'); }
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', apply); window.visualViewport.addEventListener('scroll', apply); }
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
  apply();
})();

window.addEventListener('error', e => { try { toast('Ошибка: ' + (e.message || 'unknown')); } catch(_){} });
window.addEventListener('unhandledrejection', e => { try { toast('Ошибка: ' + ((e.reason && e.reason.message) || 'promise')); } catch(_){} });

/* ХЕЛПЕРЫ */
function esc(s){ if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function initials(name){ if (!name) return '?'; return name.split(' ').filter(Boolean).map(w=>w[0]).join('').substr(0,2).toUpperCase() || '?'; }
function formatDate(ts){ return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function formatTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2500); }
function showModal(bodyHtml, headerHtml){
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalHeader').innerHTML = '<div class="modal-handle"></div>' + (headerHtml || '');
  document.getElementById('modalBg').classList.add('open');
  document.querySelectorAll('#modalBody input, #modalBody select, #modalBody textarea').forEach(el => {
    el.addEventListener('focus', () => setTimeout(() => el.scrollIntoView({ block:'center', behavior:'smooth' }), 250));
  });
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('modalHeader').innerHTML = '';
}

/* СОСТОЯНИЕ */
let DB = { users:{}, events:{}, threads:{}, polls:{}, venues:{} };
let state = { tab:'home', threadId:null, eventId:null, eventFromTab:'calendar', messages:{}, unsub:[], birthdayChecked:false, gallerySelectMode: false, gallerySelected: [] };
let currentUser = null, currentProfile = null;
function me(){ return currentProfile; }
const PUBLISH_ROLES = ['owner','admin','coach','captain'];
function canPublishLineup(){ return PUBLISH_ROLES.includes(currentProfile?.role); }
function hasRole(arr){ const a = [].slice.call(arguments,1); return !!currentProfile && a.indexOf(currentProfile.role) >= 0; }
function canManageEvents(){ return hasRole(['owner','admin','coach','captain','assistant']); }
function canPin(){ return canManageEvents(); }
function canManageUsers(){ return hasRole(['owner','admin']); }
function roleLabel(r){ const l = { owner:'Владелец', admin:'Админ', coach:'Тренер', captain:'Капитан', assistant:'Ассистент', player:'Игрок' }; return l[r] || r; }
function roleIcon(r){ const i = { owner:'👑', admin:'🔧', coach:'📋', captain:'🏒', assistant:'🤝' }; return i[r] || ''; }
function renderAvatar(user, size){ size = size || 48; if (!user) return ''; const colors = { goalie:'linear-gradient(135deg,#3B82F6,#8B5CF6)', defense:'linear-gradient(135deg,#10B981,#34D399)', forward:'linear-gradient(135deg,#F97316,#EC4899)' }; const bg = colors[user.position] || 'var(--grad-pt)'; return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+bg+';font-size:'+Math.round(size/3)+'px">' + esc(user.short || initials(user.name)) + '</div>'; }

/* ПОДПИСКИ */
function subscribeAll(){
  cleanupSubs();

  state.unsub.push(onSnapshot(collection(db,'users'), snap => {
    DB.users = {}; snap.forEach(d => DB.users[d.id] = d.data());
    if (currentUser && DB.users[currentUser.uid]) currentProfile = DB.users[currentUser.uid];
    if (!state.threadId && !state.eventId) render();
    if (!state.birthdayChecked) {
      state.birthdayChecked = true;
      checkBirthdayCongrats().catch(e => console.warn('birthday check:', e));
    }
  }));

  state.unsub.push(onSnapshot(collection(db,'events'), snap => {
    DB.events = {}; snap.forEach(d => DB.events[d.id] = d.data());
    if (!state.threadId) {
      if (state.eventId) renderEventDetail(); else render();
    }
  }));

  state.unsub.push(onSnapshot(collection(db,'threads'), snap => {
    DB.threads = {}; snap.forEach(d => DB.threads[d.id] = d.data());
    if (!DB.threads['general']) {
      DB.threads['general'] = { id: 'general', type: 'general', name: 'Общий чат', messages: [], pinned: [] };
    }
    renderChatListIfActive();
  }));

  state.unsub.push(onSnapshot(collection(db,'polls'), snap => {
    DB.polls = {}; snap.forEach(d => DB.polls[d.id] = d.data());
    if (state.tab === 'home') render();
  }));

  state.unsub.push(onSnapshot(collection(db,'venues'), snap => {
    DB.venues = {}; snap.forEach(d => DB.venues[d.id] = d.data());
    if (state.tab === 'calendar') render();
  }));
}

/* СТАРТ */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const userSnap = await getDoc(doc(db,'users',user.uid));
    if (userSnap.exists()) {
      currentProfile = userSnap.data();
      subscribeAll();
      render();
    } else {
      cleanupSubs();
      renderCreateProfileScreen();
    }
  } else {
    currentUser = null; currentProfile = null;
    cleanupSubs();
    renderLogin();
  }
});

/* РЕНДЕР */
function render(){
  hideChatBar();
  if (!currentUser || !currentProfile) return;
  document.getElementById('tabs').hidden = false;
  renderHeader();
  switch(state.tab){
    case 'home': renderHome(); break;
    case 'calendar': renderCalendar(); break;
    case 'chat': renderChat(); break;
    case 'team': renderTeam(); break;
  }
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
}
function renderHeader(){
  const titles = { home:'🏒 Политехника', calendar:'Календарь', chat:'Чат', team:'Команда' };
  document.getElementById('hdr').innerHTML = '<div class="row" style="justify-content:space-between">' +
    '<div class="hdr-title">' + titles[state.tab] + '</div>' +
    '<div onclick="editMyProfile()" style="cursor:pointer">' + renderAvatar(currentProfile, 40) + '</div></div>';
}
function hideChatBar(){ const bar = document.getElementById('chatBar'); bar.hidden = true; bar.innerHTML = ''; }

/* ДНИ РОЖДЕНИЯ */
function getUpcomingBirthdays(daysAhead){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const out = [];
  Object.values(DB.users).forEach(u => {
    if (!u.birthday || u.status !== 'active') return;
    const parts = u.birthday.split('-').map(Number);
    let mm, dd;
    if (parts.length === 3) { mm = parts[1]; dd = parts[2]; }
    else if (parts.length === 2) { mm = parts[0]; dd = parts[1]; }
    else return;
    if (!mm || !dd) return;
    let target = new Date(today.getFullYear(), mm - 1, dd);
    if (target < today) target = new Date(today.getFullYear() + 1, mm - 1, dd);
    const diffDays = Math.round((target - today) / 86400000);
    if (diffDays <= daysAhead) out.push({ user: u, days: diffDays, date: target });
  });
  return out.sort((a,b) => a.days - b.days);
}
function getMoscowDateParts(){
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  return { year: msk.getFullYear(), month: String(msk.getMonth() + 1).padStart(2, '0'), day: String(msk.getDate()).padStart(2, '0'), hour: msk.getHours() };
}
async function checkBirthdayCongrats(){
  if (!currentUser || !currentProfile) return;
  const { year, month, day, hour } = getMoscowDateParts();
  if (hour < 6) return;
  const todayMD = month + '-' + day;
  const dateKey = year + '-' + todayMD;
  const msgId = 'birthday_' + dateKey;
  const msgRef = doc(db, 'threads', 'general', 'messages', msgId);
  const existing = await getDoc(msgRef);
  if (existing.exists()) return;
  const names = Object.values(DB.users).filter(u => {
    if (u.status !== 'active' || !u.birthday) return false;
    const parts = u.birthday.split('-');
    const userMD = parts.length === 3 ? parts[1] + '-' + parts[2] : u.birthday;
    return userMD === todayMD;
  });
  if (names.length === 0) return;
  const namesText = names.join(', ');
  const isMany = names.length > 1;
  const text = isMany
    ? '🎂 Сегодня день рождения у наших товарищей ' + namesText + '!\nПоздравляем от всей команды и желаем им всего наилучшего! 🏒🔥'
    : '🎂 Сегодня день рождения у нашего товарища ' + namesText + '!\nПоздравляем от всей команды и желаем всего наилучшего! 🏒🔥';
  await setDoc(msgRef, { userId: 'system', type: 'birthday', text, ts: Date.now() });
}

/* ГЛАВНАЯ */
function renderHome(){
  const now = Date.now();
  const events = Object.values(DB.events).filter(e => e.startsAt > now && !e.cancelled).sort((a,b)=>a.startsAt-b.startsAt);
  const next = events[0];
  let html = '';
  if (next) {
    const going = next.rsvp ? Object.values(next.rsvp).filter(v => v === 'going').length : 0;
    const myStatus = next.rsvp && next.rsvp[currentUser.uid];
    html += '<div class="card" style="background:var(--grad-pt);color:#fff;border:none">' +
      '<div class="tiny" style="color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.1em">Следующая игра</div>' +
      '<div style="font-size:22px;font-weight:700;margin-top:4px">' + esc(next.title) + '</div>' +
      '<div style="opacity:.9;font-size:14px">' + formatDate(next.startsAt) + ' · ' + formatTime(next.startsAt) + ' · ' + esc(next.venue) + '</div>' +
      '<div style="font-size:40px;font-weight:800;margin:6px 0">' + formatCountdown(next.startsAt - now) + '</div>' +
      '<div class="small" style="opacity:.85;margin-bottom:8px">Идут: ' + going + ' / ' + (next.limitPlayers || 22) + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="btn ' + (myStatus==='going'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvp(\''+next.id+'\',\'going\')">✓ Иду</button>' +
        '<button class="btn ' + (myStatus==='waitlist'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvp(\''+next.id+'\',\'waitlist\')">Резерв</button>' +
        '<button class="btn ' + (myStatus==='declined'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvp(\''+next.id+'\',\'declined\')">✕</button>' +
      '</div></div>';
  }
  const birthdays = getUpcomingBirthdays(7);
  if (birthdays.length > 0) {
    html += '<h3 style="margin:20px 0 12px;font-size:20px">🎂 Дни рождения</h3>';
    birthdays.forEach(b => {
      const when = b.days === 0 ? 'Сегодня!' : b.days === 1 ? 'Завтра' : 'Через ' + b.days + ' дн.';
      const whenColor = b.days <= 1 ? 'var(--red)' : 'var(--pt-blue)';
      html += '<div class="card row" style="margin-bottom:10px;padding:12px">' + renderAvatar(b.user, 44) +
        '<div style="flex:1;min-width:0"><div style="font-weight:700">' + esc(b.user.name) + '</div>' +
        '<div class="small muted">' + b.date.toLocaleDateString('ru-RU', { day:'numeric', month:'long' }) + '</div></div>' +
        '<div style="font-weight:700;color:' + whenColor + '">' + when + '</div></div>';
    });
  }
  const activePolls = Object.values(DB.polls).filter(p => !p.threadId && !p.closed);
  if (activePolls.length) {
    html += '<h3 style="margin:20px 0 12px;font-size:20px">📊 Опросы</h3>';
    activePolls.forEach(p => html += renderPoll(p, null));
  }
  if (canPin()) html += '<button class="btn btn-secondary" onclick="showCreatePoll(null)" style="width:100%;margin-bottom:14px">📊 Создать опрос</button>';
  if (events.length) {
    html += '<h3 style="margin:20px 0 12px;font-size:20px">Ближайшие события</h3>';
    events.slice(0,5).forEach(e => html += renderEventCard(e));
  } else if (!next) {
    html += '<div class="empty-state"><div style="font-size:48px;margin-bottom:16px;opacity:.5">🏒</div><h3>Пока нет событий</h3></div>';
  }
  document.getElementById('view').innerHTML = html;
}
function formatCountdown(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000), m = Math.floor((ms%3600000)/60000);
  if (d > 0) return d + ' дн ' + h + ' ч';
  if (h > 0) return h + ' ч ' + m + ' мин';
  return Math.max(0,m) + ' мин';
}
function renderEventCard(e){
  const going = e.rsvp ? Object.values(e.rsvp).filter(v => v === 'going').length : 0;
  const icon = e.type === 'game' ? '🥅' : '🏒';
  return '<div class="card" style="cursor:pointer" onclick="openEvent(\''+e.id+'\')">' +
    '<div class="row"><div style="width:52px;height:52px;border-radius:14px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:26px">' + icon + '</div>' +

    '<div class="tiny">/' + (e.limitPlayers || 22) + '</div></div></div></div>';

async function setRsvp(eventId, status){
  const e = DB.events[eventId]; if (!e) return;
  const uid = currentUser.uid;
  const rsvp = e.rsvp || {};
  rsvp[uid] = status;
  if (status === 'going') {
    const goingCount = Object.values(rsvp).filter(v => v === 'going').length;
    if (goingCount > (e.limitPlayers || 22)) { rsvp[uid] = 'waitlist'; toast('Мест нет — вы в резерве'); }
  }
  await updateDoc(doc(db,'events',eventId), { rsvp });
}

/* КАЛЕНДАРЬ */
function renderCalendar(){
  const now = Date.now();
  const events = Object.values(DB.events).filter(e => e.startsAt > now && !e.cancelled).sort((a,b)=>a.startsAt-b.startsAt);
  const past = Object.values(DB.events).filter(e => e.startsAt <= now || e.cancelled).sort((a,b)=>b.startsAt-a.startsAt).slice(0,10);
  let html = '';
  if (canManageEvents()) {
    html += '<button class="btn btn-primary" onclick="showCreateEvent()" style="width:100%;margin-bottom:12px">＋ Создать событие</button>';
    const venues = Object.entries(DB.venues || {});
    if (venues.length > 0) {
      html += '<div style="margin-bottom:20px; background:var(--card); border-radius:var(--radius-md); padding:12px; border:1px solid var(--border)">';
      html += '<div class="tiny muted" style="margin-bottom:8px; text-transform:uppercase; letter-spacing:0.05em">Сохранённые адреса:</div>';
      venues.forEach(([id, v]) => {
        html += '<div class="row" style="justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--fill)">' +
          '<div style="font-size:14px">📍 ' + esc(v.name) + '</div>' +
          '<button class="btn btn-ghost" style="padding:4px; color:var(--red); font-size:16px" onclick="deleteVenue(\'' + id + '\')">✕</button>' +
        '</div>';
      });
      html += '</div>';
    }
  }
  if (events.length) { html += '<h3 style="margin:16px 0 12px;font-size:20px">Предстоящие</h3>'; events.forEach(e => html += renderEventCard(e)); }
  else html += '<div class="empty-state"><div style="font-size:48px;margin-bottom:16px;opacity:.5">📅</div><h3>Нет предстоящих событий</h3></div>';
  if (past.length) { html += '<h3 style="margin:20px 0 12px;font-size:17px;color:var(--text-2)">Прошедшие</h3>'; past.forEach(e => html += renderEventCard(e)); }
  document.getElementById('view').innerHTML = html;
}
async function deleteVenue(id) {
  if (!canManageEvents()) return;
  if (confirm('Удалить этот адрес из списка?')) {
    await deleteDoc(doc(db, 'venues', id));
    toast('Адрес удалён');
  }
}
function showCreateEvent(){
  if (!canManageEvents()) return;
  const venues = Object.values(DB.venues || {});
  let venueOptions = '<option value="">-- Выбрать из сохранённых --</option>';
  venues.forEach(v => { venueOptions += '<option value="' + esc(v.name) + '">' + esc(v.name) + '</option>'; });
  showModal(
    '<select class="input" id="evType"><option value="training">🏒 Тренировка</option><option value="game">🥅 Игра</option></select>' +
    '<input class="input" id="evTitle" placeholder="Название (необязательно)">' +
    '<input class="input" id="evDate" type="datetime-local">' +
    '<select class="input" id="evVenueSelect">' + venueOptions + '</select>' +
    '<input class="input" id="evVenueNew" placeholder="Или новый адрес">' +
    '<input class="input" id="evLimit" type="number" min="1" max="99" value="22" placeholder="Лимит игроков">',
    '<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:18px">Новое событие</h3><button class="btn btn-primary" id="modalSubmit" style="padding:10px 18px;font-size:14px">Создать</button></div>'
  );
  document.getElementById('modalSubmit').onclick = async () => {
    const typeVal = document.getElementById('evType').value;
    let title = document.getElementById('evTitle').value.trim();
    if (!title) title = typeVal === 'game' ? 'Игра' : 'Тренировка';
    const dateVal = document.getElementById('evDate').value;
    const selectedVenue = document.getElementById('evVenueSelect').value;
    const newVenue = document.getElementById('evVenueNew').value.trim();
    if (!dateVal) { toast('Выберите дату'); return; }
    let venueVal = newVenue || selectedVenue || 'Арена';
    const ts = new Date(dateVal).getTime();
    if (isNaN(ts)) { toast('Неверная дата'); return; }
    const id = 'ev_' + Date.now().toString(36);
    if (newVenue) {
      const venueId = 'v_' + Date.now().toString(36);
      await setDoc(doc(db, 'venues', venueId), { name: newVenue, createdBy: currentUser.uid });
    }
    const event = { id, type: typeVal, title, startsAt: ts, venue: venueVal, limitPlayers: parseInt(document.getElementById('evLimit').value,10) || 22, rsvp:{}, cancelled:false, createdBy: currentUser.uid, createdAt: Date.now() };
    await setDoc(doc(db,'events',id), event);
    const threadId = 'event_' + id;
    await setDoc(doc(db,'threads',threadId), { id:threadId, type:'event', name:title, eventId:id, createdAt:Date.now() });
    closeModal(); toast('Событие создано');
  };
}

}

      html += '<h4 style="margin:16px 0 8px;color:var(--pt-blue)">📋 Утверждённый состав</h4>';

function openLineupManager(eventId) {

    let newGlobalJersey = e.globalJersey || 'home';
    if (isGame) newGlobalJersey = document.getElementById('globalJerseySelect').value;
    allUsers.forEach(u => {
      if (isGame) {
        const role = document.getElementById('pos_role_' + u.id).value;
        const line = document.getElementById('pos_line_' + u.id).value;
        if (role) newPositions[u.id] = { role, line };
      } else {
        const jersey = document.getElementById('jersey_' + u.id).value;
        if (jersey) newJerseys[u.id] = jersey;
      }
    });
    const newGuests = [];
    document.querySelectorAll('#guestList .row').forEach(row => {
      const nameInput = row.querySelector('input[id^="guest_name_"]');
      if (!nameInput || !nameInput.value.trim()) return;
      const gData = { name: nameInput.value.trim() };
      if (isGame) gData.homeNum = row.querySelector('input[id^="guest_home_"]').value.trim();
      else gData.color = row.querySelector('select[id^="guest_color_"]').value;
      newGuests.push(gData);
    });
    const newLines = isGame ? document.getElementById('lineupLines').value.trim() : '';
    await updateDoc(doc(db, 'events', eventId), {
      lineup: { jerseys: newJerseys, lines: newLines, positions: newPositions, guests: newGuests },
      globalJersey: newGlobalJersey,
      lineupPublishedAt: Date.now()
    });
    closeModal();
    toast('Состав опубликован');
    renderEventDetail();
  };
}

    await setDoc(doc(db,'users',userCred.user.uid), { id: userCred.user.uid, name, short: initials(name), role:'player', status:'active', createdAt: Date.now() });

  } catch (e) { toast('Ошибка: ' + (e.message || 'не удалось')); }
}

/* ПРОФИЛЬ */
function editMyProfile(){
  let danger = '';
  if (currentProfile.role === 'owner') {
    danger = '<hr style="border:none;border-top:1px solid var(--border)">' +
      '<button class="btn btn-ghost" onclick="showResetConfirm()" style="width:100%;color:var(--red)">⚠️ Сбросить данные команды</button>';
  }
  let bdValue = '';
  if (currentProfile.birthday) bdValue = currentProfile.birthday;
  showModal(
    '<label class="small muted">Имя</label><input class="input" id="editName" value="' + esc(currentProfile.name) + '" placeholder="Имя">' +
    '<label class="small muted" style="margin-top:4px">Дата рождения</label><input class="input" id="editBirthday" type="date" value="' + bdValue + '">' +
    '<div class="tiny muted" style="margin-top:-4px">Показываем только месяц и день</div>' +
    '<button class="btn btn-primary" onclick="saveMyProfile()" style="margin-top:8px">Сохранить</button>' +
    '<button class="btn btn-secondary" onclick="logout()">Выйти</button>' + danger,
    '<div class="row"><h3 style="margin:0;font-size:18px">Мой профиль</h3></div>'
  );
}
async function saveMyProfile(){
  const name = document.getElementById('editName').value.trim();
  if (!name) { toast('Введите имя'); return; }
  const data = { name, short: initials(name) };
  const bd = document.getElementById('editBirthday').value;
  if (bd) data.birthday = bd; else data.birthday = null;
  await updateDoc(doc(db,'users',currentUser.uid), data);
  closeModal(); toast('Сохранено');
}
function showResetConfirm(){
  showModal('<p style="color:var(--red);font-weight:600">Это удалит все события и списки!</p>' +
    '<input class="input" id="resetPassword" type="password" placeholder="Пароль">' +
    '<button class="btn btn-danger" onclick="confirmReset()">Удалить всё</button>' +
    '<button class="btn btn-secondary" onclick="closeModal()">Отмена</button>',
    '<div class="row"><h3 style="margin:0;font-size:18px;color:var(--red)">⚠️ Опасно</h3></div>');
}
async function confirmReset(){
  const p = document.getElementById('resetPassword').value;
  try {
    await signInWithEmailAndPassword(auth, currentUser.email, p);
    const collections = ['users','events','threads','polls','venues'];
    for (const c of collections) {
      const snap = await getDocs(collection(db,c));
      for (const d of snap.docs) await deleteDoc(d.ref).catch(()=>{});
    }
    await signOut(auth); location.reload();
  } catch (e) { toast('Неверный пароль'); }
}
async function logout(){ await signOut(auth); }

/* СОЗДАНИЕ ПРОФИЛЯ (если нет записи в базе) */

}

  document.getElementById('hdr').innerHTML = '';

async function doLogin(){

  if (!email || !pass) { toast('Введите email и пароль'); return; }

function showPrivacyPolicy(){
  showModal('<h3 style="margin-bottom:12px;font-size:18px">Политика</h3><p class="small muted">Здесь будет текст (152-ФЗ).</p><button class="btn btn-primary" onclick="closeModal()" style="width:100%">Понятно</button>', '<div class="row"><h3 style="margin:0;font-size:18px">Согласие</h3></div>');

function showRegisterModal(){
  showModal(
    '<input class="input" id="regName" placeholder="Имя и фамилия">' +
    '<input class="input" id="regEmail" type="email" placeholder="Email">' +
    '<input class="input" id="regPassword" type="password" placeholder="Пароль (мин. 6)">' +
    '<input class="input" id="regInvite" placeholder="Код приглашения">' +
    '<label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-top:8px;">' +
      '<input type="checkbox" id="regConsent" style="margin-top:4px;">' +
      '<span>Я даю согласие на обработку персональных данных (<a href="#" onclick="showPrivacyPolicy()" style="color:var(--pt-blue);text-decoration:underline;">клик</a>)</span>' +
    '</label>',
    '<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:18px">Регистрация</h3><button class="btn btn-primary" id="modalSubmit" style="padding:10px 18px;font-size:14px">Создать</button></div>'
  );
  document.getElementById('modalSubmit').onclick = async () => {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const inviteCode = document.getElementById('regInvite').value.trim().toUpperCase();
    const consent = document.getElementById('regConsent').checked;
    const SECRET_CODE = 'ПОЛИТЕХ';
    if (!name || !email || pass.length < 6) { toast('Заполните все поля (пароль от 6)'); return; }
    if (inviteCode !== SECRET_CODE) { toast('Неверный код'); return; }
    if (!consent) { toast('Нужно согласие'); return; }
    try {
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, 'users', userCred.user.uid), { id: userCred.user.uid, name, short: initials(name), role: 'player', status: 'active', createdAt: Date.now() });
      closeModal(); toast('Успешно');
    } catch (e) { toast('Ошибка: ' + (e.message || 'email занят')); }
  };
}

/* ОПРОСЫ */
function renderPoll(poll, threadId){
  const totalVotes = poll.options.reduce((s,o) => s + (o.votes||[]).length, 0);
  const isClosed = poll.closed;
  const author = DB.users[poll.createdBy] ? DB.users[poll.createdBy].name : '?';
  let html = '<div class="card" style="border-left:4px solid var(--pt-blue);margin-bottom:10px">' +
    '<div class="row" style="align-items:flex-start;margin-bottom:10px"><div style="flex:1"><div style="font-weight:700;font-size:15px">📊 ' + esc(poll.question) + '</div>' +
    '<div class="tiny">от ' + esc(author) + (isClosed ? ' · <span style="color:var(--red)">завершён</span>' : '') + '</div></div>' +
    (canPin() && !isClosed ? '<button class="btn btn-ghost" style="padding:4px 8px" onclick="closePoll(\''+poll.id+'\')">✕</button>' : '') +
    '</div>';
  poll.options.forEach(opt => {
    const pct = totalVotes > 0 ? Math.round((opt.votes.length / totalVotes) * 100) : 0;
    const myVote = opt.votes.includes(currentUser.uid);
    html += '<div style="margin-bottom:8px"><button class="btn ' + (myVote ? 'btn-primary' : 'btn-secondary') + '" style="width:100%;text-align:left;padding:10px 14px;position:relative;overflow:hidden" onclick="votePoll(\''+poll.id+'\',\''+opt.id+'\')" ' + (isClosed ? 'disabled' : '') + '>' +
      '<div style="position:absolute;left:0;top:0;bottom:0;background:rgba(37,99,235,.15);width:' + pct + '%"></div>' +
      '<div style="position:relative;display:flex;justify-content:space-between"><span>' + esc(opt.text) + (myVote ? ' ✓' : '') + '</span><div style="font-weight:700">' + pct + '%</div></div>' +
      '</button></div>';
  });
  return html + '</div>';
}
async function votePoll(pollId, optionId){
  const poll = DB.polls[pollId]; if(!poll || poll.closed) return;
  const uid = currentUser.uid;
  const options = poll.options.map(o => {
    const votes = o.votes || [];
    const already = votes.includes(uid);
    if (o.id === optionId) return { ...o, votes: already ? votes.filter(u => u !== uid) : votes.concat(uid) };
    if (!poll.allowMultiple) return { ...o, votes: votes.filter(u => u !== uid) };
    return o;
  });
  await updateDoc(doc(db,'polls',pollId), { options });
  closeModal();
}
async function closePoll(pollId){ if(!canPin()) return; await updateDoc(doc(db,'polls',pollId), { closed: true }); closeModal(); }
function showCreatePoll(threadId){
  if (!canPin()) return;
  showModal(
    '<input class="input" id="pollQ" placeholder="Вопрос">' +
    '<div id="pollOptions" style="display:flex;flex-direction:column;gap:8px"></div>' +
    '<button class="btn btn-secondary" id="addOptBtn" style="padding:10px;font-size:14px">+ Вариант</button>' +
    '<label class="row small"><input type="checkbox" id="pollMulti"> Несколько вариантов</label>',
    '<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:18px">Новый опрос</h3><button class="btn btn-primary" id="modalSubmit" style="padding:10px 18px;font-size:14px">Создать</button></div>'
  );
  let count = 0;
  function addOption(){ count++; const wrap = document.createElement('div'); wrap.className = 'row'; wrap.style.gap = '6px'; wrap.innerHTML = '<input class="input" placeholder="Вариант ' + count + '" style="flex:1"><button class="btn btn-ghost" style="padding:6px;color:var(--red)">✕</button>'; wrap.querySelector('button').onclick = () => wrap.remove(); document.getElementById('pollOptions').appendChild(wrap); }
  addOption(); addOption();
  document.getElementById('addOptBtn').onclick = addOption;
  document.getElementById('modalSubmit').onclick = async () => {
    const q = document.getElementById('pollQ').value.trim();
    const opts = [...document.querySelectorAll('#pollOptions input')].map(i => i.value.trim()).filter(Boolean);
    if (!q) { toast('Введите вопрос'); return; }
    if (opts.length < 2) { toast('Минимум 2 варианта'); return; }
    const id = 'poll_' + Date.now().toString(36);
    await setDoc(doc(db,'polls',id), { id, question: q, options: opts.map((t,i) => ({ id:'o'+(i+1), text:t, votes:[] }), createdBy: currentUser.uid, createdAt: Date.now(), threadId: threadId || null, closed: false, allowMultiple: document.getElementById('pollMulti').checked ) });
    closeModal(); toast('Опрос создан');
  };
}
