<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Политехника — Хоккей</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --pt-blue:#2563EB; --grad-pt:linear-gradient(135deg,#2563EB,#3B82F6,#60A5FA);
  --bg:#F8FAFC; --card:#FFF; --border:#E2E8F0; --text:#0F172A; --text-2:#64748B; --text-3:#94A3B8; --fill:#F1F5F9;
  --red:#EF4444; --green:#10B981; --orange:#F97316;
  --shadow-sm:0 2px 8px rgba(15,23,42,.08); --shadow-glow:0 0 24px rgba(37,99,235,.25);
  --radius-lg:22px; --radius-md:16px; --radius-pill:999px;
  --app-h:100dvh; --app-top:0px;
  --snow-color: #cbd5e1;
}
body.dark-theme {
  --bg:#0F172A; --card:#1E293B; --border:#334155; --text:#F8FAFC; --text-2:#94A3B8; --text-3:#64748B; --fill:#334155;
  --shadow-sm:0 2px 8px rgba(0,0,0,.5); --shadow-glow:0 0 24px rgba(37,99,235,.4);
  --snow-color: #475569;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);position:fixed;top:var(--app-top);left:0;right:0;height:var(--app-h);overflow:hidden; transition: background 0.3s, color 0.3s;}
.app{position:relative;height:100%;width:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden; z-index: 2; transition: background 0.3s;}
#hdr{flex:0 0 auto;padding:16px 20px;background:var(--bg);border-bottom:1px solid var(--border);z-index:10;padding-top:calc(16px + env(safe-area-inset-top,0px)); transition: background 0.3s, border 0.3s;}
.hdr-title{font-size:32px;font-weight:800;letter-spacing:-.04em;background:var(--grad-pt);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#view{flex:1 1 auto;overflow-y:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.chat-bar{flex:0 0 auto;display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--card);border-top:1px solid var(--border); transition: background 0.3s, border 0.3s;}
.chat-bar[hidden]{display:none}
.tabs{flex:0 0 auto;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px)); transition: background 0.3s, border 0.3s;}
.tabs[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 14px;border:none;background:none;color:var(--text-3);cursor:pointer;border-radius:var(--radius-pill)}
.tab.active{color:var(--pt-blue)}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab-label{font-size:11px;font-weight:600}
.card{background:var(--card);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow-sm);border:1px solid var(--border); transition: background 0.3s, border 0.3s;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--radius-pill);font-size:15px;font-weight:600;border:none;cursor:pointer;font-family:inherit; transition: transform 0.1s, background 0.3s;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--grad-pt);color:#fff;box-shadow:var(--shadow-glow)}
.btn-secondary{background:var(--fill);color:var(--text)}
.btn-danger{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--pt-blue);padding:8px 12px}
.btn-icon{padding:10px;min-width:42px;height:42px}
.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:16px;background:var(--card);color:var(--text);outline:none;font-family:inherit; transition: background 0.3s, border 0.3s, color 0.3s;}
.input:focus{border-color:var(--pt-blue);box-shadow:0 0 0 4px rgba(37,99,235,.1)}
.app-icon{width:80px;height:80px;border-radius:20px;background:var(--grad-pt);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:var(--shadow-glow)}
.modal-bg{position:fixed;top:var(--app-top);left:0;right:0;height:var(--app-h);background:rgba(15,23,42,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:480px;max-height:100%;display:flex;flex-direction:column;overflow:hidden; transition: background 0.3s;}
.modal-header{flex:0 0 auto;padding:10px 20px 12px;background:var(--card);border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0; transition: background 0.3s, border 0.3s;}
.modal-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 120px;display:flex;flex-direction:column;gap:12px}
.modal-handle{width:36px;height:6px;background:var(--border);border-radius:3px;margin:0 auto 10px}
.toast{position:fixed;bottom:calc(100px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-3)}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--text-2)}
.small{font-size:13px}
.tiny{font-size:13px;color:var(--text-3)}
.chat-msg{max-width:78%;padding:8px 12px;border-radius:18px;box-shadow:var(--shadow-sm);word-break:break-word;white-space:pre-wrap; transition: background 0.3s, transform 0.1s;}
.chat-msg:active {transform: scale(0.98);}
.chat-msg .msg-sticker{font-size:76px;line-height:1;padding:0}
.sticker-panel{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px;background:var(--fill);border-radius:var(--radius-md);max-height:200px;overflow-y:auto}
.sticker-panel button{font-size:26px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer}
.bday-card{padding:14px 18px;border-radius:18px;font-size:15px;font-weight:600;text-align:center;box-shadow:var(--shadow-sm);white-space:pre-wrap;line-height:1.4;max-width:92%}

#snow-container {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1; overflow: hidden; display: none;
}
.snowflake {
  position: absolute; top: -10px; color: var(--snow-color);
  font-size: 1.2em; opacity: 0.7; animation: fall linear infinite;
}
@keyframes fall { to { transform: translateY(110vh); } }

.switch { position: relative; display: inline-block; width: 50px; height: 30px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
.slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--green); }
input:checked + .slider:before { transform: translateX(20px); }
body.dark-theme .slider { background-color: #475569; }
body.dark-theme input:checked + .slider { background-color: var(--green); }
</style>
</head>
<body>
<div id="snow-container"></div>

<div class="app">
  <header id="hdr"></header>
  <main id="view"></main>
  <div id="chatBar" class="chat-bar" hidden></div>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab" data-tab="home" onclick="setTab('home')"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="tab-label">Главная</span></button>
    <button class="tab" data-tab="calendar" onclick="setTab('calendar')"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10z"/></svg><span class="tab-label">Календарь</span></button>
    <button class="tab" data-tab="chat" onclick="setTab('chat')"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><span class="tab-label">Чат</span></button>
    <button class="tab" data-tab="team" onclick="setTab('team')"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span class="tab-label">Команда</span></button>
  </nav>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><div class="modal-header" id="modalHeader"></div><div class="modal-body" id="modalBody"></div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit, arrayUnion } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyB05YHmSSZgCFM-FYwnMhbk4eBdOoVNHss",
  authDomain: "hockey-politech.firebaseapp.com",
  projectId: "hockey-politech",
  storageBucket: "hockey-politech.firebasestorage.app",
  messagingSenderId: "618530656800",
  appId: "1:618530656800:web:028c3785863de533506245"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let userSettings = {
  theme: localStorage.getItem('app_theme') || 'light',
  animations: localStorage.getItem('app_animations') !== 'false',
  vibration: localStorage.getItem('app_vibration') !== 'false'
};

if (userSettings.theme === 'dark') document.body.classList.add('dark-theme');

(function createSnow() {
  const container = document.getElementById('snow-container');
  if (!container || !userSettings.animations) return;
  container.style.display = 'block';
  container.innerHTML = '';
  const snowflakeChar = '❄';
  for (let i = 0; i < 15; i++) {
    const flake = document.createElement('div');
    flake.className = 'snowflake';
    flake.innerText = snowflakeChar;
    flake.style.left = Math.random() * 100 + 'vw';
    flake.style.animationDuration = (Math.random() * 3 + 4) + 's';
    flake.style.animationDelay = Math.random() * 5 + 's';
    flake.style.opacity = Math.random() * 0.5 + 0.3;
    container.appendChild(flake);
  }
})();

(function(){
  const root = document.documentElement;
  function apply(){
    const vv = window.visualViewport;
    if (vv) { root.style.setProperty('--app-h', vv.height + 'px'); root.style.setProperty('--app-top', vv.offsetTop + 'px'); }
    else { root.style.setProperty('--app-h', window.innerHeight + 'px'); root.style.setProperty('--app-top', '0px'); }
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', apply); window.visualViewport.addEventListener('scroll', apply); }
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
  apply();
})();

window.addEventListener('error', e => { try { toast('Ошибка: ' + (e.message || 'unknown')); } catch(_){} });
window.addEventListener('unhandledrejection', e => { try { toast('Ошибка: ' + ((e.reason && e.reason.message) || 'promise')); } catch(_){} });

function esc(s){ if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function initials(name){ if (!name) return '?'; return name.split(' ').filter(Boolean).map(w=>w[0]).join('').substr(0,2).toUpperCase() || '?'; }
function formatDate(ts){ return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function formatTime(ts){ return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2500); }

function vibrate(ms = 15){
  if (!userSettings.vibration) return;
  if (navigator.vibrate) navigator.vibrate(ms);
}

function playSound(){
  if (localStorage.getItem('app_sound') === 'false') return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

function showModal(bodyHtml, headerHtml){
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalHeader').innerHTML = '<div class="modal-handle"></div>' + (headerHtml || '');
  document.getElementById('modalBg').classList.add('open');
  document.querySelectorAll('#modalBody input, #modalBody select, #modalBody textarea').forEach(el => {
    el.addEventListener('focus', () => setTimeout(() => el.scrollIntoView({ block:'center', behavior:'smooth' }), 250));
  });
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('modalHeader').innerHTML = '';
}

let DB = { users:{}, events:{}, threads:{}, polls:{}, venues:{} };
let state = { tab:'home', threadId:null, eventId:null, eventFromTab:'calendar', messages:{}, unsub:[], birthdayChecked:false, gallerySelectMode:false, gallerySelected:[] };
let currentUser = null, currentProfile = null;
function me(){ return currentProfile; }
function hasRole(){ const arr = [].slice.call(arguments); return !!currentProfile && arr.indexOf(currentProfile.role) >= 0; }
function canManageEvents(){ return hasRole('owner','admin','coach','captain','assistant'); }
function canPin(){ return hasRole('owner','admin','coach','captain','assistant'); }
function canManageUsers(){ return hasRole('owner','admin'); }
function roleLabel(r){ const l = { owner:'Владелец', admin:'Админ', coach:'Тренер', captain:'Капитан', assistant:'Ассистент', player:'Игрок' }; return l[r] || r; }
function roleIcon(r){ const i = { owner:'👑', admin:'🔧', coach:'📋', captain:'🏒', assistant:'🤝' }; return i[r] || ''; }

function renderAvatar(user, size){
  size = size || 48;
  if (!user) return '';
  if (user.avatarUrl) {
    return '<img src="' + user.avatarUrl + '" class="avatar" style="width:'+size+'px;height:'+size+'px;object-fit:cover;">';
  }
  const colors = { goalie:'linear-gradient(135deg,#3B82F6,#8B5CF6)', defense:'linear-gradient(135deg,#10B981,#34D399)', forward:'linear-gradient(135deg,#F97316,#EC4899)' };
  const bg = colors[user.position] || 'var(--grad-pt)';
  const letter = initials(user.name || user.nickname || '?');
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+bg+';font-size:'+Math.round(size/3)+'px">' + esc(letter) + '</div>';
}

function renderNameBlock(user, isMe, colorClass = 'text-2'){
  if (!user) return '';
  const nick = user.nickname || user.name || '?';
  const realName = user.name || '';
  return `<div style="line-height:1.2;">
    <div style="font-weight:700; font-size:14px;">${esc(nick)}</div>
    ${realName ? `<div class="tiny" style="color:var(--${color2});">${esc(realName)}</div>` : ''}
  </div>`;
}

function subscribeAll(){
  state.unsub.forEach(u => { try { u(); } catch(_){} });
  state.unsub = [];

  state.unsub.push(onSnapshot(collection(db,'users'), snap => {
    DB.users = {}; snap.forEach(d => DB.users[d.id] = d.data());
    if (currentUser && DB.users[currentUser.uid]) currentProfile = DB.users[currentUser.uid];
    if (!state.threadId && !state.eventId) render();
    if (!state.birthdayChecked) {
      state.birthdayChecked = true;
      checkBirthdayAnimation().catch(e => console.warn('birthday anim:', e));
    }
  }));

  state.unsub.push(onSnapshot(collection(db,'events'), snap => {
    DB.events = {}; snap.forEach(d => DB.events[d.id] = d.data());
    if (!state.threadId) {
      if (state.eventId) renderEventDetail(); else render();
    }
  }));

  state.unsub.push(onSnapshot(collection(db,'threads'), snap => {
    DB.threads = {}; snap.forEach(d => DB.threads[d.id] = d.data());
    if (!DB.threads['general']) {
      DB.threads['general'] = { id: 'general', type: 'general', name: 'Общий чат', messages: [], pinned: [] };
    }
    renderChatListIfActive();
  }));

  state.unsub.push(onSnapshot(collection(db,'polls'), snap => {
    DB.polls = {}; snap.forEach(d => DB.polls[d.id] = d.data());
    if (state.tab === 'home') render();
  }));

  state.unsub.push(onSnapshot(collection(db,'venues'), snap => {
    DB.venues = {}; snap.forEach(d => DB.venues[d.id] = d.data());
    if (state.tab === 'calendar') render();
  }));
}

async function checkBirthdayAnimation(){
  if (!currentUser || !currentProfile) return;
  const now = new Date();
  const todayMD = String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  const bdayUsers = Object.values(DB.users).filter(u => {
    if (u.status !== 'active' || !u.birthday) return false;
    const parts = u.birthday.split('-');
    const userMD = parts.length === 3 ? parts[1] + '-' + parts[2] : u.birthday;
    return userMD === todayMD;
  });
  if (bdayUsers.length > 0) {
    const names = bdayUsers.map(u => u.nickname || u.name).join(' и ');
    if (userSettings.animations && typeof confetti === 'function') {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      setTimeout(() => confetti({ particleCount: 100, angle: 60, spread: 55, origin: { x: 0 } }), 250);
      setTimeout(() => confetti({ particleCount: 100, angle: 120, spread: 55, origin: { x: 1 } }), 400);
    }
    setTimeout(() => {
      showModal(
        `<div style="text-align:center; padding:20px 0;">
          <div style="font-size:60px; margin-bottom:10px;">🎉</div>
          <h2 style="margin-bottom:8px; font-size:24px;">С Днём Рождения!</h2>
          <p class="muted" style="font-size:16px; margin-bottom:20px;">Сегодня свой праздник отмечает <b>${esc(names)}</b>!</p>
          <button class="btn btn-primary" style="width:100%;" onclick="closeModal();">Поздравить в чате</button>
        </div>`,
        '<div class="row"><h3 style="margin:0;font-size:18px">Праздник!</h3></div>'
      );
    }, 1000);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const userSnap = await getDoc(doc(db,'users',user.uid));
    if (userSnap.exists()) {
      currentProfile = userSnap.data();
      subscribeAll();
      render();
    } else {
      renderActivationScreen();
    }
  } else {
    currentUser = null; currentProfile = null;
    state.unsub.forEach(u=>{try{u()}catch(_){}});
    state.unsub = [];
    renderLogin();
  }
});

function render(){
  if (!currentUser || !currentProfile) return;
  document.getElementById('tabs').hidden = false;
  renderHeader();
  switch(state.tab){
    case 'home': renderHome(); break;
    case 'calendar': renderCalendar(); break;
    case 'chat': renderChat(); break;
    case 'team': renderTeam(); break;
  }
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
}

function renderHeader(){
  const titles = { home:'🏒 Политехника', calendar:'Календарь', chat:'Чат', team:'Команда' };
  document.getElementById('hdr').innerHTML = '<div class="row" style="justify-content:space-between">' +
    '<div class="hdr-title">' + titles[state.tab] + '</div>' +
    '<div style="display:flex;gap:12px;">' +
      '<button class="btn btn-ghost" style="padding:4px;" onclick="showSettings()">⚙️</button>' +
      '<div onclick="editMyProfile()" style="cursor:pointer">' + renderAvatar(currentProfile, 40) + '</div>' +
    '</div></div>';
}

function hideChatBar(){ const bar = document.getElementById('chatBar'); bar.hidden = true; bar.innerHTML = ''; }

function showSettings(){
  vibrate(10);
  showModal(
    '<div style="display:flex; flex-direction:column; gap:16px;">' +
    '<div class="row" style="justify-content:space-between; padding: 8px 0; border-bottom:1px solid var(--border)">' +
      '<div><div style="font-weight:700;">Тёмная тема</div><div class="tiny muted">iPhone Dark Mode</div></div>' +
      '<label class="switch"><input type="checkbox" id="setTheme" ' + (userSettings.theme === 'dark' ? 'checked' : '') + '><span class="slider"></span></label>' +
    '</div>' +
    '<div class="row" style="justify-content:space-between; padding: 8px 0; border-bottom:1px solid var(--border)">' +
      '<div><div style="font-weight:700;">Уведомления</div><div class="tiny muted">Пуш (после настройки)</div></div>' +
      '<label class="switch"><input type="checkbox" id="setNotif" ' + (localStorage.getItem('app_notif') !== 'false' ? 'checked' : '') + '><span class="slider"></span></label>' +
    '</div>' +
    '<div class="row" style="justify-content:space-between; padding: 8px 0; border-bottom:1px solid var(--border)">' +

function getUpcomingBirthdays(daysAhead){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const out = [];
  Object.values(DB.users).forEach(u => {
    if (!u.birthday || u.status !== 'active') return;
    const parts = u.birthday.split('-').map(Number);
    let mm, dd;
    if (parts.length === 3) { mm = parts[1]; dd = parts[2]; }
    else if (parts.length === 2) { mm = parts[0]; dd = parts[1]; }
    else return;
    if (!mm || !dd) return;
    let target = new Date(today.getFullYear(), mm - 1, dd);
    if (target < today) target = new Date(today.getFullYear() + 1, mm - 1, dd);
    const diffDays = Math.round((target - today) / 86400000);
    if (diffDays <= daysAhead) out.push({ user: u, days: diffDays, date: target });
  });
  return out.sort((a,b) => a.days - b.days);
}

function getMoscowDateParts(){
  const now = new Date();
  const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
  return { year: msk.getFullYear(), month: String(msk.getMonth() + 1).padStart(2, '0'), day: String(msk.getDate()).padStart(2, '0'), hour: msk.getHours() };
}

async function checkBirthdayCongrats(){
  if (!currentUser || !currentProfile) return;
  const { year, month, day, hour } = getMoscowDateParts();
  if (hour < 6) return;
  const todayMD = month + '-' + day;
  const dateKey = year + '-' + todayMD;
  const msgId = 'birthday_' + dateKey;
  const msgRef = doc(db, 'threads', 'general', 'messages', msgId);
  const existing = await getDoc(msgRef);
  if (existing.exists()) return;
  const birthdayUsers = Object.values(DB.users).filter(u => {
    if (u.status !== 'active' || !u.birthday) return false;
    const parts = u.birthday.split('-');
    const userMD = parts.length === 3 ? parts[1] + '-' + parts[2] : u.birthday;
    return userMD === todayMD;
  });
  if (birthdayUsers.length === 0) return;
  const names = birthdayUsers.map(u => u.name);
  const namesText = names.join(', ');
  const isMany = names.length > 1;
  const text = isMany
    ? '🎂 Сегодня день рождения у наших товарищей ' + namesText + '!\nПоздравляем от всей команды и желаем им всего наилучшего! 🏒🔥'
    : '🎂 Сегодня день рождения у нашего товарища ' + namesText + '!\nПоздравляем от всей команды и желаем всего наилучшего! 🏒🔥';
  await setDoc(msgRef, { userId: 'system', type: 'birthday', text, ts: Date.now() });
}

function formatCountdown(ms){
  const m = Math.max(0, ms);
  const d = Math.floor(m/86400000), h = Math.floor((m%86400000)/3600000), mm = Math.floor((m%3600000)/60000);
  if (d > 0) return d + ' дн ' + h + ' ч';
  if (h > 0) return h + ' ч ' + mm + ' мин';
  return mm + ' мин';
}

function renderEventCard(e){
  const now = Date.now();
  const going = e.rsvp ? Object.values(e.rsvp).filter(v => v === 'going').length : 0;

  const isOngoing = now >= e.startsAt && now < e.startsAt + (12 * 60 * 60 * 1000);
  let statusBadge = '';
  if (e.cancelled) statusBadge = '<span style="color:var(--red); font-size:12px;">Отменено</span>';
  else if (isOngoing) statusBadge = '<span style="color:var(--orange); font-size:12px;">🔥 Идет сейчас</span>';
  else if (now >= e.startsAt + (12 * 60 * 60 * 1000)) statusBadge = '<span style="color:var(--text-3); font-size:12px;">Завершено</span>';
  return '<div class="card" style="cursor:pointer" onclick="openEvent(\''+e.id+'\')">' +

}

async function setRsvP(eventId, status){
  vibrate(10);
  const e = DB.events[eventId]; if (!e) return;
  const timeLeft = e.startsAt - Date.now();
  const isLocked = timeLeft < (4 * 60 * 60 * 1000);
  if (isLocked && !canManageEvents()) { toast('Запись закрыта (менее 4 часов до начала)'); return; }
  const uid = currentUser.uid;
  const rsvp = e.rsvp || {};
  const oldStatus = rsvp[uid];
  if (oldStatus === status) return;
  rsvp[uid] = status;
  if (status === 'going') {
    const goingIds = Object.keys(rsvp).filter(k => rsvp[k] === 'going');
    const goingUsers = goingIds.map(id => DB.users[id]).filter(Boolean);
    const goingGoalies = goingUsers.filter(u => u.position === 'goalie').length;
    const goingField = goingUsers.filter(u => u.position !== 'goalie').length;
    const isGoalie = currentProfile.position === 'goalie';
    const limitGoalies = e.limitGoalies || 2;
    const limitField = e.limitPlayers || 20;
    if (isGoalie && goingGoalies >= limitGoalies) { rsvp[uid] = 'waitlist'; toast('Мест для вратарей нет — вы в резерве'); }
    else if (!isGoalie && goingField >= limitField) { rsvp[uid] = 'waitlist'; toast('Мест для полевых нет — вы в резерве'); }
  }
  if (status === 'declined' && (oldStatus === 'going' || oldStatus === 'waitlist')) {
    const goingIds = Object.keys(rsvp).filter(k => rsvp[k] === 'going');
    const goingUsers = goingIds.map(id => DB.users[id]).filter(Boolean);
    const goingGoalies = goingUsers.filter(u => u.position === 'goalie').length;
    const goingField = goingUsers.filter(u => u.position !== 'goalie').length;
    const limitGoalies = e.limitGoalies || 2;
    const limitField = e.limitPlayers || 20;
    let waiterId = null;
    if (goingGoalies < limitGoalies) waiterId = Object.keys(rsvp).find(k => rsvp[k] === 'waitlist' && DB.users[k] && DB.users[k].position === 'goalie');
    if (!waiterId && goingField < limitField) waiterId = Object.keys(rsvp).find(k => rsvp[k] === 'waitlist' && (!DB.users[k] || DB.users[k].position !== 'goalie'));
    if (waiterId) {
      rsvp[waiterId] = 'going';
      const waiterName = DB.users[waiterId] ? (DB.users[waiterId].nickname || DB.users[waiterId].name) : 'Игрок';
      const myName = DB.users[uid] ? (DB.users[uid].nickname || DB.users[uid].name) : 'Игрок';
      const threadId = 'event_' + eventId;
      await addDoc(collection(db, 'threads', threadId, 'messages'), { userId: 'system', type: 'text', text: `⚠️ ${myName} не сможет прийти. Освободилось место! ${waiterName} автоматически добавлен в состав.`, ts: Date.now() });
      toast('Освободилось место! Игрок из резерва добавлен.');
    }
  }
  await updateDoc(doc(db,'events',eventId), { rsvp });
}

  renderEventDetail();
}
function backFromEvent(){ state.eventId = null; state.tab = state.eventFromTab || 'calendar'; render(); }

function renderEventDetail(){
  const e = DB.events[state.eventId]; if (!e) { backFromEvent(); return; }
  const CITY = 'Екатеринбург';
  const isGame = e.type === 'game';
  const rsvp = e.rsvp || {};
  const going = Object.entries(rsvp).filter(([_,v]) => v === 'going').map(([uid]) => DB.users[uid]).filter(Boolean);
  const waitlist = Object.entries(rsvp).filter(([_,v]) => v === 'waitlist').map(([uid]) => DB.users[uid]).filter(Boolean);
  const declined = Object.entries(rsvp).filter(([_,v]) => v === 'declined').map(([uid]) => DB.users[uid]).filter(Boolean);
  const myStatus = rsvp[currentUser.uid];
  const now = Date.now();
  const isOngoing = now >= e.startsAt;
  const isFinished = now >= e.startsAt + (12 * 60 * 60 * 1000);
  const isLocked = (now > (e.startsAt - 4 * 60 * 60 * 1000)) && !canManageEvents();
  const positions = (e.lineup && e.lineup.positions) ? e.lineup.positions : {};
  const jerseys = (e.lineup && e.lineup.jerseys) ? e.lineup.jerseys : {};
  const guests = (e.lineup && e.lineup.guests) ? e.lineup.guests : [];
  const hasLineup = Object.keys(positions).length > 0 || Object.keys(jerseys).length > 0 || guests.length > 0;
  let html = '<div class="card"><h2 style="font-size:22px">' + esc(e.title) + (e.cancelled ? ' <span style="color:var(--red);font-size:14px">(отменено)</span>' : '') + '</h2>';
  if (isOngoing && !isFinished) html += '<div style="display:inline-block; background:var(--orange); color:white; padding:4px 8px; border-radius:8px; font-size:12px; font-weight:700; margin-bottom:8px;">🔥 Идёт сейчас</div>';
  else if (isFinished) html += '<div style="display:inline-block; background:var(--text-3); color:white; padding:4px 8px; border-radius:8px; font-size:12px; font-weight:700; margin-bottom:8px;">Завершено</div>';
  html += '<div class="small muted">' + formatDate(e.startsAt) + ' · ' + formatTime(e.startsAt) + '</div><div style="margin-top:8px"><a href="https://yandex.ru/maps/?text=' + encodeURIComponent(CITY + ', ' + e.venue) + '" target="_blank" class="btn btn-secondary" style="padding:8px 12px;font-size:13px;text-decoration:none;display:inline-flex;gap:6px">📍 ' + esc(e.venue) + ' (Маршрут)</a></div>';
  if (isGame && e.globalJersey) { const gText = e.globalJersey === 'home' ? '🏠 Домашняя' : '✈️ Гостевая'; html += '<div class="small" style="margin-top:8px; font-weight:600; color:var(--pt-blue);">Форма команды: ' + gText + '</div>'; }
  const goingGoalies = going.filter(u => u.position === 'goalie').length;
  const goingField = going.length - goingGoalies;
  html += '<div class="small muted" style="margin-top:8px">Полевые: ' + goingField + ' / ' + (e.limitPlayers||20) + ' · Вратари: ' + goingGoalies + ' / ' + (e.limitGoalies||2) + (waitlist.length ? ' · Резерв: ' + waitlist.length : '') + '</div>';
  if (isLocked || isOngoing) {
    html += '<div style="margin-top:12px; background:var(--fill); padding:10px; border-radius:12px; text-align:center; font-size:14px; color:var(--text-2);">' + (isOngoing ? '⏳ Событие началось. Запись закрыта.' : '⏳ Запись закрыта (менее 4 часов до начала).') + '</div>';
  } else {
    html += '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn ' + (myStatus==='going'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvP(\''+e.id+'\',\'going\')">✓ Иду</button><button class="btn ' + (myStatus==='waitlist'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvP(\''+e.id+'\',\'waitlist\')">Резерв</button><button class="btn ' + (myStatus==='declined'?'btn-primary':'btn-secondary') + '" style="flex:1;font-size:14px;padding:10px" onclick="setRsvP(\''+e.id+'\',\'declined\')">✕</button></div>';
  }
  if (canManageEvents()) {
    html += '<div class="row" style="gap:8px;margin-top:12px"><button class="btn btn-secondary" style="flex:1;font-size:13px;padding:10px" onclick="openLineupManager(\''+e.id+'\')">📋 Состав и звенья</button></div><div class="row" style="gap:8px;margin-top:8px"><button class="btn btn-secondary" style="flex:1;font-size:13px;padding:8px" onclick="toggleCancelEvent(\''+e.id+'\')">' + (e.cancelled ? '↺ Вернуть' : '✕ Отменить') + '</button><button class="btn btn-danger" style="font-size:13px;padding:8px" onclick="deleteEvent(\''+e.id+'\')">🗑</button></div>';
  }
  html += '<div style="margin-top:8px"><button class="btn btn-secondary" style="width:100%;font-size:14px;padding:10px" onclick="openEventChat(\''+e.id+'\')">💬 Чат события</button></div></div>';
  if (hasLineup) {
    if (isGame) {
      let groups = { goalie: [], defense: [], forward1: [], forward2: [], forward3: [], forward4: [], sub: [] };
      Object.keys(positions).forEach(uid => { const u = DB.users[uid]; if (!u) return; const pos = positions[uid]; if (pos.role === 'goalie') groups.goalie.push(u); else if (pos.role === 'defense') groups.defense.push(u); else if (pos.role === 'sub') groups.sub.push(u); else if (pos.role === 'forward') { const lk = 'forward' + (pos.line || '1'); if (groups[lk]) groups[lk].push(u); else groups.forward1.push(u); } });
      html += '<h4 style="margin:16px 0 8px;color:var(--pt-blue)">📋 Утверждённый состав</h4><div class="card" style="padding:12px; background:var(--fill);">';
      let total = 0;
      const rg = (title, list, icon) => { if (!list.length) return; total += list.length; html += `<div style="margin-bottom:12px;"><strong style="font-size:14px; color:var(--text-2);">${icon} ${title}</strong><br>`; list.forEach(u => { html += `<div style="margin-top:4px;">${renderNameBlock(u,false)}</div>`; }); html += '</div>'; };
      rg('Вратари', groups.goalie, '🥅'); rg('Защитники', groups.defense, '🛡'); rg('1-е звено', groups.forward1, '⚔️'); rg('2-е звено', groups.forward2, '⚔️'); rg('3-е звено', groups.forward3, '⚔️'); rg('4-е звено', groups.forward4, '⚔️'); rg('Запасные', groups.sub, '🪑');
      if (guests.length > 0) { total += guests.length; html += `<div style="margin-bottom:12px;"><strong style="font-size:14px; color:var(--text-2);">👤 Гости</strong><br>`; guests.forEach(g => { html += `<div style="font-size:14px; margin-top:4px;">${esc(g.name)}</div>`; }); html += '</div>'; }
      if (total === 0) html += '<div class="small muted" style="text-align:center;">Тренер ещё не составил состав.</div>';
      if (e.lineup.lines) html += '<div style="margin-top:12px; border-top:1px dashed var(--border); padding-top:12px;"><strong style="font-size:14px; color:var(--text-2);">Заметки:</strong><br><span style="font-size:14px; white-space:pre-wrap;">' + esc(e.lineup.lines) + '</span></div>';
      html += '</div>';
    } else {
      let blacks = [], whites = [];
      Object.keys(jerseys).forEach(uid => { const u = DB.users[uid]; if (!u) return; if (jerseys[uid] === 'black') blacks.push(u); if (jerseys[uid] === 'white') whites.push(u); });
      html += '<h4 style="margin:16px 0 8px;color:var(--pt-blue)">📋 Распределение по цветам</h4><div class="card" style="padding:12px; background:var(--fill);">';
      if (blacks.length) { html += '<div style="margin-bottom:12px;"><strong style="font-size:14px; color:var(--text-2);">⚫ Чёрные</strong><br>'; blacks.forEach(u => { html += `<div style="margin-top:4px;">${renderNameBlock(u,false)}</div>`; }); html += '</div>'; }
      if (whites.length) { html += '<div style="margin-bottom:12px;"><strong style="font-size:14px; color:var(--text-2);">⚪ Белые</strong><br>'; whites.forEach(u => { html += `<div style="margin-top:4px;">${renderNameBlock(u,false)}</div>`; }); html += '</div>'; }
      if (guests.length > 0) { html += '<div style="margin-bottom:12px;"><strong style="font-size:14px; color:var(--text-2);">👤 Гости</strong><br>'; guests.forEach(g => { html += `<div style="font-size:14px; margin-top:4px;">${esc(g.name)}</div>`; }); html += '</div>'; }
      if (!blacks.length && !whites.length && !guests.length) html += '<div class="small muted" style="text-align:center;">Распределение ещё не сделано.</div>';
      html += '</div>';
    }
  }
  html += list('✓ Идут','var(--green)',going);
  html += list('⏳ Резерв','var(--orange)',waitlist);
  html += list('✕ Не смогут','var(--text-3)',declined);
  document.getElementById('view').innerHTML = html;
}

function openLineupManager(eventId){
  const e = DB.events[eventId]; const isGame = e.type === 'game';
  const allUsers = Object.values(DB.users).filter(u => u.status === 'active');
  const rsvp = e.rsvp || {};
  const lineup = e.lineup || {};
  const jerseys = lineup.jerseys || {}; const positions = lineup.positions || {};
  const linesText = lineup.lines || ''; const guests = lineup.guests || [];
  const globalJersey = e.globalJersey || 'home';
  let html = '';
  if (isGame) {
    html += '<div style="margin-bottom:16px; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:12px;"><div style="font-weight:700; margin-bottom:8px; font-size:14px;">Форма команды:</div><select class="input" id="globalJerseySelect" style="padding:8px; font-size:14px;"><option value="home" ' + (globalJersey==='home'?'selected':'') + '>🏠 Домашняя</option><option value="guest" ' + (globalJersey==='guest'?'selected':'') + '>✈️ Гостевая</option></select></div><h3 style="margin-bottom:12px;font-size:16px">Состав на игру</h3>';
  } else {
    html += '<h3 style="margin-bottom:12px;font-size:16px">Распределение цветов (тренировка)</h3>';
  }
  allUsers.forEach(u => {
    const currentPos = positions[u.id] || { role: '', line: '1' };
    const currentJ = jerseys[u.id] || '';
    const status = rsvp[u.id] || 'none';
    const statusText = (status === 'going' ? '<span style="color:var(--green);font-size:11px;">✓ Идёт</span>' : (status === 'waitlist' ? '<span style="color:var(--orange);font-size:11px;">⏳ Резерв</span>' : (status === 'declined' ? '<span style="color:var(--red);font-size:11px;">✕ Не может</span>' : '<span style="color:var(--text-3);font-size:11px;">— Не ответил</span>'));
    html += `<div style="background:var(--fill); padding:10px; border-radius:12px; margin-bottom:10px;"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">${renderNameBlock(u,false)} ${statusText}</div><div class="row" style="gap:6px;">`;
    if (isGame) {
      html += `<select class="input" id="pos_role_${u.id}" style="flex:1; padding:6px; font-size:12px;"><option value="" ${currentPos.role===''?'selected':''}>— Не в составе —</option><option value="goalie" ${currentPos.role==='goalie'?'selected':''}>🥅 Вратарь</option><option value="defense" ${currentPos.role==='defense'?'selected':''}>🛡 Защитник</option><option value="forward" ${currentPos.role==='forward'?'selected':''}>⚔️ Нападающий</option><option value="sub" ${currentPos.role==='sub'?'selected':''}>🪑 Запасной</option></select><select class="input" id="pos_line_${u.id}" style="width:65px; padding:6px; font-size:12px;"><option value="1" ${currentPos.line==='1'?'selected':''}>1 зв.</option><option value="2" ${currentPos.line==='2'?'selected':''}>2 зв.</option><option value="3" ${currentPos.line==='3'?'selected':''}>3 зв.</option><option value="4" ${currentPos.line==='4'?'selected':''}>4 зв.</option></select>`;
    } else {
      html += `<select class="input" id="jersey_${u.id}" style="flex:1; padding:6px; font-size:13px;"><option value="" ${currentJ===''?'selected':''}>— Не распределён —</option><option value="black" ${currentJ==='black'?'selected':''}>⚫ Чёрная</option><option value="white" ${currentJ==='white'?'selected':''}>⚪ Белая</option></select>`;
    }
    html += '</div></div>';
  });
  let html2 = '<h3 style="margin:16px 0 12px;font-size:16px">Гости</h3><div id="guestList">';
  guests.forEach((g, i) => { html2 += `<div class="row" style="margin-bottom:8px; gap:6px;" id="guest_row_${i}"><input class="input" id="guest_name_${i}" value="${esc(g.name)}" placeholder="Имя" style="flex:1; padding:8px;">${isGame ? '<input class="input" type="number" id="guest_home_${i}" value="${g.homeNum||''}" placeholder="Дом" style="width:55px; padding:8px; text-align:center;">' : '<select class="input" id="guest_color_${i}" style="width:90px; padding:8px; font-size:13px;"><option value="">Цвет</option><option value="black" ${g.color==='black'?'selected':''}>⚫</option><option value="white" ${g.color==='white'?'selected':''}>⚪</option></select>`}<button class="btn btn-ghost" style="padding:4px; color:var(--red);" onclick="document.getElementById(\'guest_row_${i}\').remove()">✕</button></div>`; });
  html2 += '</div><button class="btn btn-secondary" id="addGuestBtn" style="font-size:13px; padding:8px; margin-bottom:12px;">+ Добавить гостя</button>';
  if (isGame) { html2 += '<h3 style="margin:16px 0 12px;font-size:16px">Заметки</h3><textarea class="input" id="lineupLines" style="height:80px; resize:none; font-size:14px;" placeholder="Тактика...">${esc(linesText)}</textarea>'; }
  showModal(html + html2, '<div class="row" style="justify-content:space-between"><h3 style="margin:0;font-size:18px">Планшет тренера</h3><button class="btn btn-primary" id="saveLineupBtn" style="padding:10px 18px;font-size:14px">Опубликовать</button></div>');
  let guestCount = guests.length;
  document.getElementById('addGuestBtn').onclick = () => {
    const wrap = document.createElement('div'); wrap.className = 'row'; wrap.style = 'margin-bottom:8px; gap:6px;'; wrap.id = 'guest_row_' + guestCount;
    let inner = `<input class="input" id="guest_name_${guestCount}" placeholder="Имя" style="flex:1; padding:8px;">`;
    if (isGame) inner += `<input class="input" type="number" id="guest_home_${guestCount}" placeholder="Дом" style="width:55px; padding:8px; text-align:center;">`;
    else inner += `<select class="input" id="guest_color_${guestCount}" style="width:90px; padding:8px; font-size:13px;"><option value="">Цвет</option><option value="black">⚫</option><option value="white">⚪</option></select>`;
    inner += `<button class="btn btn-ghost" style="padding:4px; color:var(--red);" onclick="document.getElementById(\'guest_row_${guestCount}\').remove()">✕</button>`;
    wrap.innerHTML = inner; document.getElementById('guestList').appendChild(wrap); guestCount++;
  };
  document.getElementById('saveLineupBtn').onclick = async () => {
    const newPositions = {}; const newJerseys = {}; let newGlobal = e.globalJersey || 'home';
    if (isGame) newGlobal = document.getElementById('globalJerseySelect').value;
    allUsers.forEach(u => {
      if (isGame) { const r = document.getElementById('pos_role_'+u.id).value; const l = document.getElementById('pos_line_'+u.id).value; if (r) newPositions[u.id] = { role: r, line: l }; }
      else { const j = document.getElementById('jersey_'+u.id).value; if (j) newJerseys[u.id] = j; }
    });
    const newGuests = [];
    document.querySelectorAll('#guestList .row').forEach(row => {
      const ni = row.querySelector('input[id^="guest_name_"]'); if (!ni || !ni.value.trim()) return;
      const g = { name: ni.value.trim() };
      if (isGame) { const nh = row.querySelector('input[id^="guest_home_"]'); if (nh) g.homeNum = nh.value.trim(); }
      else { const nc = row.querySelector('select[id^="guest_color_"]'); if (nc) g.color = nc.value; }
      newGuests.push(g);
    });
    const newLines = isGame ? document.getElementById('lineupLines').value.trim() : '';
    await updateDoc(doc(db, 'events', eventId), { lineup: { jerseys: newJerseys, lines: newLines, positions: newPositions, guests: newGuests }, globalJersey: newGlobal });
    closeModal(); toast('Состав опубликован!'); renderEventDetail();
  };
}

async function toggleCancelEvent(id){ if(!canManageEvents()) return; const e = DB.events[id]; await updateDoc(doc(db,'events',id), { cancelled: !e.cancelled }); toast(e.cancelled ? 'Возвращено' : 'Отменено'); renderEventDetail(); }
async function deleteEvent(id){ if(!canManageEvents()) return; if(!confirm('Удалить событие и чат?')) return; await deleteDoc(doc(db,'events',id)); await deleteDoc(doc(db,'threads','event_'+id)).catch(()=>{}); backFromEvent(); }
function openEventChat(eventId){ state.tab='chat'; state.threadId='event_'+eventId; render(); }

/* ЧАТ */
function renderChat(){
  if (state.threadId) { renderThread(state.threadId); return; }
  renderChatListIfActive();
}

function renderChatListIfActive(){
  if (state.tab !== 'chat' || state.threadId) return;
  let html = '';
  html += '<h3 style="margin:16px 0 12px;font-size:20px">Чаты</h3>';
  Object.keys(DB.threads || {}).forEach(id => {
    const t = DB.threads[id]; if (!t) return;
    const isCurrent = state.threadId === id;
    const eventId = id.startsWith('event_') ? id.replace('event_','') : null;
    const sub = eventId ? (DB.events[eventId]?.title || 'Событие') : 'Общий чат';
    html += `<div class="card row" style="padding:12px; cursor:pointer; border-bottom:1px solid var(--border)" onclick="openChat('${id}')">${esc(t.name)}<div class="tiny muted" style="margin-top:4px">${esc(sub)}</div>${isCurrent ? '<div style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--pt-blue);font-weight:700">✓</div>' : ''}</div>`;
  });
  document.getElementById('view').innerHTML = html;
}
function openChat(id){ state.threadId = id; render(); }

function renderThread(threadId){
  if (!currentUser || !currentProfile) return;
  const t = DB.threads[threadId]; if (!t) { state.threadId = null; render(); return; }
  const msgs = (await getDocs(collection(db, 'threads', threadId, 'messages'))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.ts-b.ts);
  let html = `<div class="row" style="justify-content:space-between"><button class="btn btn-ghost" style="padding:8px 0" onclick="state.threadId=null; render()">← Назад</button><h3 style="margin:0;font-size:18px">${esc(t.name)}</h3></div>`;
  msgs.forEach(m => {
    const isMe = m.userId === currentUser.uid;
    const name = (m.userId === 'system' ? 'Система' : (DB.users[m.userId]?.nickname || DB.users[m.userId].name || '?')) || '?';
    const text = m.type === 'text' ? m.text : String(m.text);
    const bg = isMe ? 'var(--grad-pt)' : 'var(--card)';
    const align = isMe ? 'flex-end' : 'flex-start';
    const br = isMe ? '1px solid var(--pt-blue)' : '1px solid var(--border)';
    html += `<div class="chat-msg" style="text-align:${align};background:${bg};color:#fff;border:${br};margin-bottom:10px;max-width:70%;word-break:break-word;white-space:pre-wrap"><div style="padding:10px;border-radius:14px;font-size:14px;line-height:1.4">${name}: ${esc(text)}</div></div>`;
  });
  html += `<div style="display:flex;gap:8px;padding:12px;background:var(--card);border-top:1px solid var(--border);margin-top:16px;"><input class="input" id="chatInput" style="flex:1;padding:10px;font-size:14px" placeholder="Сообщение..."><button class="btn btn-primary" style="padding:10px;font-size:14px" onclick="sendChat()">Отправить</button></div>`;
  document.getElementById('view').innerHTML = html;
  function sendChat(){ const v = document.getElementById('chatInput').value.trim(); if(!v) return; addDoc(collection(db,'threads',threadId,'messages'),{userId:currentUser.uid,type:'text',text:v,ts:Date.now()}).then(()=>{ document.getElementById('chatInput').value=''; renderThread(threadId); }); }
}

/* КОМАНДА */
function renderTeam(){
  let html = '<h3 style="margin:16px 0 12px;font-size:20px">Команда</h3>';
  Object.values(DB.users).forEach(u => {
    if (u.status === 'active') html += `<div class="card row" style="margin-bottom:12px;">${renderAvatar(u,40)} ${renderNameBlock(u, false)}</div>`;
  });
  document.getElementById('view').innerHTML = html;
}
